<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Elige tu futuro: buscador y orientación de educación superior en Chile. Gratis para estudiantes.">
<meta name="theme-color" content="#2D5BFF">
<title>Elige tu futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#2D5BFF;--morado:#7B3FF2;--turq:#14C8B8;--ink:#141B34;--muted:#5B6480;--line:#E4E8F2;
  --bg:#F5F7FC;--card:#fff;--ok:#12A36B;--warn:#E09A12;--bad:#E04848;
  --grad:linear-gradient(135deg,#2D5BFF 0%,#7B3FF2 60%,#14C8B8 130%);
  --r:16px;--sh:0 2px 10px rgba(20,27,52,.06),0 8px 24px rgba(20,27,52,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--azul)}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.top{position:sticky;top:0;z-index:20;background:rgba(245,247,252,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;cursor:pointer}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.top .sp{flex:1}
.pill-demo{font-size:11px;font-weight:700;background:#FFF4DB;color:#8A5A00;border:1px solid #F5D88E;padding:3px 8px;border-radius:99px;white-space:nowrap}
.wrap{padding:16px}
h1{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:22px 0 10px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:24px 20px 20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;right:40px;bottom:-80px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero p{opacity:.92;margin-top:6px;position:relative;z-index:1}
.hero h1{position:relative;z-index:1}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:4px 4px 4px 14px;margin-top:16px;box-shadow:var(--sh);position:relative;z-index:1}
.search input{flex:1;border:0;outline:0;padding:10px 0;min-width:0;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;transition:.15s}
.btn.pri{background:var(--azul);color:#fff}
.btn.pri:hover{background:#1f47e0}
.btn.sec{background:#EEF2FF;color:var(--azul)}
.btn.ghost{border:1px solid var(--line);background:#fff}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;gap:6px;border:1px solid transparent;transition:.15s}
.tile:hover{border-color:#C9D4FF;transform:translateY(-1px)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.tile b{font-size:15px}
.tile span{font-size:12.5px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.ccard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 14px 12px;margin-bottom:12px;border:1px solid transparent;cursor:pointer;transition:.15s}
.ccard:hover{border-color:#C9D4FF}
.ccard .row1{display:flex;gap:10px;align-items:flex-start}
.ccard .badge-area{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.ccard h3{font-size:15.5px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:#F0F2F8;color:#3B4363;white-space:nowrap}
.chip.g{background:#E3F7EE;color:#0B7A4F}
.chip.b{background:#EAF0FF;color:#2449CC}
.chip.p{background:#F1EAFF;color:#5B2BC4}
.chip.t{background:#DDF7F4;color:#0A7F74}
.chip.w{background:#FFF4DB;color:#8A5A00}
.chip.r{background:#FDE8E8;color:#B42323}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:#F7F8FC;border-radius:10px;padding:8px}
.kpi small{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-size:14px}
.acts{display:flex;gap:6px;margin-top:10px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#F3F5FB;font-size:17px}
.iconbtn.on{background:#FFE9EF;color:#D6336C}
.iconbtn.onc{background:#EAF0FF;color:var(--azul)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.fgroup{margin-bottom:12px}
.fgroup>label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.opt.on{background:#EAF0FF;border-color:var(--azul);color:var(--azul)}
select,.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:760px;width:100%}
.nav button{flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.nav button .e{font-size:20px;line-height:1.2}
.nav button.on{color:var(--azul)}
.nav button .cnt{position:absolute;top:4px;right:calc(50% - 22px);background:var(--morado);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;min-width:16px}
.ad{border:1px dashed #C5CBDB;border-radius:14px;padding:12px;background:repeating-linear-gradient(45deg,#FAFBFE,#FAFBFE 10px,#F4F6FB 10px,#F4F6FB 20px);margin:14px 0;position:relative}
.ad .lbl{position:absolute;top:-9px;left:12px;background:#fff;border:1px solid #C5CBDB;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.06em;color:#6A7290;padding:1px 6px}
.ad .body{display:flex;gap:10px;align-items:center}
.ad .thumb{width:46px;height:46px;border-radius:10px;background:#E4E8F2;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.ad .slot{font-size:10.5px;color:#8B92AA;margin-top:6px;font-family:ui-monospace,monospace}
.sheet-bg{position:fixed;inset:0;background:rgba(14,18,38,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;animation:up .2s}
.sheet .hd{position:sticky;top:0;background:var(--grad);color:#fff;padding:18px 16px 16px;border-radius:22px 22px 0 0;z-index:2}
.sheet .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px;z-index:5}
.sheet .hd>div,.sheet .hd>h2{padding-right:40px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sec{background:#fff;border-radius:14px;padding:14px;margin:10px 12px;box-shadow:var(--sh)}
.sec h3{margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{font-weight:600;text-align:right}
.na{color:#9AA1B8;font-style:italic;font-weight:500}
.src{font-size:11px;color:#8B92AA;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.bar{height:8px;border-radius:99px;background:#EDF0F7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.sem{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.sem div{min-width:150px;background:#F7F8FC;border-radius:10px;padding:8px;font-size:12px}
.sem b{display:block;font-size:12px;color:var(--azul);margin-bottom:4px}
.status{border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.status.ok{background:#E3F7EE;color:#0B6B46}
.status.mid{background:#FFF4DB;color:#7A5000}
.status.bad{background:#FDE8E8;color:#9E1F1F}
.status.info{background:#EAF0FF;color:#2449CC}
.disc{font-size:12px;color:var(--muted);background:#F7F8FC;border-radius:10px;padding:8px 10px;margin-top:8px}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
table.cmp th,table.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{background:#F7F8FC;font-size:11.5px;color:var(--muted);font-weight:700;position:sticky;left:0;min-width:96px}
table.cmp td.best{background:#E9F9F1;color:#0B6B46;font-weight:700}
.scroll-x{overflow-x:auto;border-radius:14px}
.q{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--sh)}
.qopts{display:grid;gap:10px;margin-top:14px}
.qopt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;transition:.12s}
.qopt:hover{border-color:var(--azul);background:#F6F8FF}
.qopt .em{font-size:22px}
.prog{height:6px;background:#E4E8F2;border-radius:99px;overflow:hidden;margin:10px 0 16px}
.prog i{display:block;height:100%;background:var(--grad);transition:.3s}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--azul);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#fff;box-shadow:var(--sh);border-bottom-left-radius:4px}
.msg.bot ul{margin:6px 0 0 18px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chatbar{position:sticky;bottom:76px;display:flex;gap:8px;background:var(--bg);padding:8px 0}
.region-map{display:flex;gap:14px}
.region-map svg{flex-shrink:0}
.rlist{flex:1;display:flex;flex-direction:column;gap:4px}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:10px;background:#fff;font-size:13px;border:1px solid var(--line);text-align:left}
.rrow.on{border-color:var(--azul);background:#EAF0FF}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--azul)}
details{background:#fff;border-radius:14px;box-shadow:var(--sh);margin-bottom:10px}
details summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"＋";color:var(--azul)}
details[open] summary:after{content:"－"}
details .in{padding:0 14px 14px;font-size:14px}
details .in p{margin-bottom:8px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;animation:up .2s;max-width:90%}
.cmpbar{position:fixed;bottom:66px;left:0;right:0;z-index:25;display:flex;justify-content:center;pointer-events:none}
.cmpbar .in{pointer-events:auto;background:var(--ink);color:#fff;border-radius:14px;margin:0 12px 8px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;max-width:736px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cmpbar .in span{flex:1;font-size:13.5px;font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e{font-size:44px;margin-bottom:6px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:20px 10px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)}h1{font-size:30px}}
/* ===== v2: diseño simplificado, color y animación ===== */
.fx{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.hero2{background:linear-gradient(120deg,#2D5BFF,#7B3FF2,#14C8B8,#2D5BFF);background-size:300% 300%;animation:shift 12s ease infinite;color:#fff;border-radius:26px;padding:28px 20px 22px;position:relative;overflow:hidden}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.floaty{position:absolute;font-size:28px;opacity:.4;animation:float 6s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{transform:translateY(-12px) rotate(10deg)}}
.hero2 h1,.hero2 p,.hero2 .search,.hero2 .kick{position:relative;z-index:1}
.kick{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.bt{border-radius:22px;padding:18px 14px;color:#fff;text-align:left;min-height:138px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 10px 22px rgba(45,91,255,.18);transition:transform .15s}
.bt:hover{transform:translateY(-3px)} .bt:active{transform:scale(.96)}
.bt .em{font-size:36px;display:inline-block;animation:pop .5s both;animation-delay:var(--d)}
.bt b{font-size:16.5px;line-height:1.2;display:block} .bt span{font-size:12.5px;opacity:.92}
.bt:after{content:"";position:absolute;right:-24px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.16)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sech h2{margin:0}
.sech a{font-size:13px;font-weight:700;text-decoration:none}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.spot{min-width:236px;max-width:236px;scroll-snap-align:start;border-radius:22px;padding:16px;color:#fff;cursor:pointer;position:relative;overflow:hidden;text-align:left;transition:transform .15s}
.spot:hover{transform:translateY(-3px)}
.spot .lab{display:inline-block;background:rgba(255,255,255,.25);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:800}
.spot h3{font-size:17px;margin-top:12px;line-height:1.2;padding-right:30px}
.spot .ins{font-size:12px;opacity:.9;margin-top:2px}
.spot .big{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.spot .big small{font-size:12px;font-weight:600;opacity:.9;margin-left:4px}
.spot .em{position:absolute;right:12px;top:12px;font-size:38px;animation:float 5s ease-in-out infinite}
.areas{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px}
.ab{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;text-align:center;line-height:1.15}
.ab i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-style:normal;box-shadow:0 6px 14px rgba(20,27,52,.14);transition:transform .2s}
.ab:hover i{transform:scale(1.1) rotate(-8deg)}
.ab.on i{outline:3px solid var(--ink);outline-offset:3px}
.arow{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 10px;scrollbar-width:none}
.arow::-webkit-scrollbar{display:none}
.arow .ab{min-width:66px}
.arow .ab i{width:46px;height:46px;font-size:21px}
.ccard2{background:#fff;border-radius:22px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.ccard2:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(20,27,52,.12)}
.band{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;color:#fff}
.band .em{font-size:22px}
.band .aname{font-size:12px;font-weight:800;flex:1;letter-spacing:.02em}
.ib{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.22);color:#fff;font-size:16px;display:inline-grid;place-items:center;margin-left:4px;transition:transform .15s}
.ib.on{background:#fff}
.ib:active{transform:scale(.8)}
.cb{padding:12px 14px 14px}
.cb h3{font-size:17.5px;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{text-align:center;background:#F6F8FD;border-radius:14px;padding:9px 4px}
.stats b{display:block;font-size:15.5px;letter-spacing:-.01em}
.stats small{font-size:11px;color:var(--muted);font-weight:600}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px}
.tag.g{background:#E3F7EE;color:#0B7A4F}.tag.w{background:#FFF4DB;color:#8A5A00}.tag.r{background:#FDE8E8;color:#B42323}.tag.t{background:#DDF7F4;color:#0A7F74}.tag.b{background:#EAF0FF;color:#2449CC}
.qrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px 0 6px}
.qrow::-webkit-scrollbar{display:none}
.count{font-size:13px;color:var(--muted);margin:8px 0 12px;font-weight:600}
.count b{color:var(--ink);font-size:16px}
.hd2{padding:22px 16px 18px;color:#fff;border-radius:24px 24px 0 0;position:relative}
.hd2 .em{position:absolute;right:56px;top:16px;font-size:48px;opacity:.9;animation:float 5s ease-in-out infinite}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 12px 0}
.ring{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:10px 4px 10px;text-align:center;position:relative}
.ring svg{width:78px;height:78px;display:block;margin:0 auto}
.ring .rv{position:absolute;top:36px;left:0;right:0;font-weight:800;font-size:14.5px;letter-spacing:-.02em}
.ring small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 12px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 14px;border-radius:99px;font-weight:700;font-size:13.5px;background:#fff;border:1px solid var(--line);transition:.15s}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabc{animation:rise .3s both}
.bigstat{border-radius:18px;padding:14px 16px;font-weight:700;display:flex;gap:12px;align-items:center;font-size:14.5px;line-height:1.35}
.bigstat .e{font-size:30px}
.bigstat.ok{background:linear-gradient(135deg,#12A36B,#3CC98A);color:#fff}
.bigstat.mid{background:linear-gradient(135deg,#F2A516,#FFC94D);color:#3B2600}
.bigstat.bad{background:linear-gradient(135deg,#E04848,#FF7A6B);color:#fff}

/* ---------- Motor de admisión ("¿Me alcanza para entrar?") ---------- */
function ponderado(c,p=S.perfil){
  if(!c.pond) return null;
  const opt = Math.max(+p.cien||0,+p.hist||0);
  const vals={nem:+p.nem,rank:+p.rank,cl:+p.cl,m1:+p.m1,m2:+p.m2||0,opt};
  const req=['nem','rank','cl','m1'];
  if(req.some(k=>!vals[k])) return null;
  let tot=0; for(const k in c.pond) tot+=c.pond[k]*(vals[k]||0);
  return Math.round(tot/100*10)/10;
}
function admision(c){
  if(c.admND) return {k:'nd',t:'Requisitos de ingreso: información no disponible en la base cargada. Revisa demre.cl o la institución.',cls:'info',cat:'nd'};
  if(!c.pond) return {k:'info',t:'Admisión directa en la institución: no exige PAES. Requiere licencia de enseñanza media.',cls:'info',cat:'directa'};
  const p=ponderado(c);
  if(p==null) return {k:'none',t:'Ingresa tus puntajes en "Mi perfil" para estimar tus posibilidades.',cls:'info',cat:'sin'};
  if(c.min!=null && p<c.min) return {k:'bad',p,t:`Tu ponderado estimado (${p}) está bajo el puntaje mínimo de postulación (${c.min}). No podrías postular con estos puntajes.`,cls:'bad',cat:'mejorar'};
  if(c.corte==null) return {k:'mid',p,t:`Cumples el mínimo (${c.min}). No hay puntaje de corte publicado para comparar.`,cls:'mid',cat:'competitiva'};
  const d=p-c.corte;
  if(d>=15) return {k:'ok',p,t:`Tu ponderado estimado (${p}) supera en ${Math.round(d)} pts el corte del último seleccionado del año anterior (${c.corte}).`,cls:'ok',cat:'cumple'};
  if(d>=-30) return {k:'mid',p,t:`Tu ponderado estimado (${p}) está cerca del corte del último seleccionado (${c.corte}). Tienes posibilidades competitivas.`,cls:'mid',cat:'competitiva'};
  return {k:'bad',p,t:`Puedes postular (superas el mínimo de ${c.min}), pero tu ponderado (${p}) está ${Math.round(-d)} pts bajo el corte del año anterior (${c.corte}).`,cls:'bad',cat:'mejorar'};
}

function filtrar(){
  const q=norm(F.q).trim();
  let r=C.filter(c=>{
    const I=inst(c);
    if(q){ const hay=norm([c.n,I.n,AREAS[c.a].n,I.com,I.reg,c.titulo,TIPO_INST[I.t],I.t].join(' ')); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
    if(F.areas.length&&!F.areas.includes(c.a)) return false;
    if(F.tipoInst.length&&!F.tipoInst.includes(I.t)) return false;
    if(F.tipo.length&&!F.tipo.includes(c.tipo)) return false;
    if(F.costo.length&&!F.costo.some(id=>RANGOS.find(x=>x.id===id).f(c))) return false;
    if(F.alcance&&c.admND) return false;
    if(F.reg&&I.reg!==F.reg&&!(F.reg==='online'&&c.mod==='Online')) return false;
    if(F.mod.length&&c.mod!=null&&!F.mod.includes(c.mod)) return false;
    if(F.jor.length&&!F.jor.some(j=>String(c.jor).includes(j))) return false;
    if(F.alcance){const a=admision(c); if(!['cumple','competitiva','directa'].includes(a.cat)) return false;}
    return true;
  });
  const o=F.orden;
  if(o==='barato') r.sort((a,b)=>(a.arancel??9e12)-(b.arancel??9e12));
  if(o==='corto') r.sort((a,b)=>a.sem-b.sem);
  if(o==='empleo') r.sort((a,b)=>(b.emp1||0)-(a.emp1||0)); if(o==='corto') r.sort((a,b)=>(a.sem??99)-(b.sem??99));
  if(o==='az') r.sort((a,b)=>a.n.localeCompare(b.n));
  return r;
}

const CCOL=['#2D5BFF','#FF5C8A','#14C8B8','#FFA41B'];
function vComparar(){
  const L=S.comp.map(id=>C.find(c=>c.id===id)).filter(Boolean);
  if(!L.length) return `<h1>Comparar</h1><div class="empty"><div class="e" style="font-size:60px;animation:float 3s infinite">⚖️</div><b>Elige hasta 4 carreras</b><br>Toca ⚖️ en cualquier carrera para agregarla.<br><button class="btn pri" style="margin-top:14px" data-go="explorar">Explorar carreras</button></div>`;
  const metric=(t,sub,fn,fmt,mode)=>{const vals=L.map(fn); const mx=Math.max(1,...vals.filter(x=>x!=null)); const b=mode==='min'?Math.min(...vals.filter(x=>x!=null)):mx;
    return `<div class="mcard fx"><h3>${t}<small>${sub}</small></h3>${L.map((c,i)=>{const x=vals[i];return `<div class="hrow ${L.length>1&&x===b?'best':''}"><span class="nm" style="color:${CCOL[i]}">${esc(c.n.length>18?c.n.slice(0,17)+'…':c.n)}</span><div class="hb"><i data-w="${x==null?0:x/mx*100}%" style="background:${CCOL[i]}"></i></div><span class="vl">${x==null?'—':fmt(x)}</span></div>`}).join('')}</div>`;};
  const pros=L.map((c,i)=>{const p=[],n=[]; const mn=f=>Math.min(...L.map(f).filter(x=>x!=null)), mxx=f=>Math.max(...L.map(f).filter(x=>x!=null));
    if(c.arancel===mn(x=>x.arancel)) p.push('Menor arancel'); if(c.sem===mn(x=>x.sem)) p.push('Más corta'); if(c.emp1===mxx(x=>x.emp1)) p.push('Mayor empleabilidad'); if(inst(c).gratuidad) p.push('Acceso a gratuidad'); if(c.emp1==null) {}
    if(L.length>1&&c.arancel===mxx(x=>x.arancel)) n.push('Arancel más alto'); if(inst(c).gratuidad===false) n.push('Sin gratuidad'); if(c.real&&c.real-c.sem>=2) n.push('Suele tardar más de lo formal'); if(admision(c).cat==='mejorar') n.push('Tu puntaje está bajo el corte');

/* ---- Ranking personal / recomendaciones ---- */
function vRanking(){
  const p=S.perfil; const areas=S.test?Object.entries(S.test.sc).filter(([k])=>!k.startsWith('_')).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]):[];
  const pres=p.presupuesto===''?null:+p.presupuesto;
  const res=C.map(c=>{
    const I=inst(c); let s=50; const why=[], warn=[];
    if(areas.length){const k=areas.indexOf(c.a); if(k>=0){s+=30-k*8; why.push('Coincide con tu interés en '+AREAS[c.a].n);} else s-=20;}
    if(p.region){ if(I.reg===p.region){s+=12;why.push('Está en tu región');} else if(c.mod==='Online'){s+=8;why.push('Puedes estudiarla online');} else {s-=8;warn.push('Implica mudarte a '+I.reg);} }
    if(pres!=null){ if(pres===0){ if(I.gratuidad){s+=8;why.push('Institución con gratuidad');} else {s-=25;warn.push('No tiene gratuidad');} } else if(c.arancel<=pres){s+=8;why.push('Arancel dentro de tu presupuesto');} else if(I.gratuidad){warn.push('Supera tu presupuesto, salvo que obtengas gratuidad');s-=6;} else {s-=20;warn.push('Supera tu presupuesto');} }
    if(p.modalidad){ if(c.mod===p.modalidad){s+=6;why.push('Modalidad '+c.mod.toLowerCase());} else s-=4; }
    if(S.test&&S.test.dur==='_corta'&&c.sem<=5){s+=8;why.push('Carrera corta, como prefieres');}
    const a=admision(c);
    if(a.cat==='cumple'){s+=10;why.push('Tu puntaje supera el corte histórico');} else if(a.cat==='competitiva'){s+=3;warn.push('Tu puntaje está cerca del corte');} else if(a.cat==='mejorar'){s-=15;warn.push('Tu puntaje está bajo el corte o el mínimo');} else if(a.cat==='directa'){why.push('Admisión directa, sin PAES');}
    if(c.emp1>=85) why.push('Alta empleabilidad ('+c.emp1+'%)');
    return {c,s,why,warn,a};
  }).sort((x,y)=>y.s-x.s);
  const grp=[['Muy compatibles con tu perfil',r=>r.s>=85&&r.warn.length===0,'g'],['Buenas alternativas',r=>r.s>=60&&r.warn.length<=1,'b'],['Alternativas que requieren revisar requisitos',r=>r.a.cat==='mejorar'||r.a.cat==='sin',''],['Opciones que podrían ser un desafío académico o económico',r=>true,'r']];
  const used=new Set();
  const blocks=grp.map(([t,f,cl])=>{const L=res.filter(r=>!used.has(r.c.id)&&f(r)).slice(0,6); L.forEach(r=>used.add(r.c.id)); return L.length?`<h2>${t}</h2>${L.map(r=>`${card(r.c)}<div class="disc" style="margin:-6px 0 14px">${r.why.length?'<b>Por qué aparece:</b> '+r.why.join(' · '):''}${r.warn.length?`<br><b>A considerar:</b> ${r.warn.join(' · ')}`:''}</div>`).join('')}`:''}).join('');
  return `<h1>Mi ranking personal</h1>
  <div class="card small"><b>Tu perfil actual:</b> ${areas.length?'Intereses: '+areas.map(a=>AREAS[a].n).join(', '):'<a href="#test">Haz el test</a> para considerar tus intereses'} · ${p.region?'Región: '+p.region:'Sin región'} · ${pres==null?'Sin límite de presupuesto':pres===0?'Solo gratuidad':'Hasta '+mm(pres)} · ${p.m1?'Con puntajes PAES':'<a href="#perfil">Sin puntajes</a>'}<br><button class="btn sec sm" style="margin-top:8px" data-go="perfil">Cambiar preferencias</button></div>
  ${blocks}`;
}

function link(c){return `<a href="#" data-open="${c.id}">${esc(c.n)} – ${inst(c).n}</a>`;}
function responder(q){
  const n=norm(q);
  const num=(n.match(/\b(\d{3})\b/)||[])[1];
  const carrera=C.find(c=>n.includes(norm(c.n).split(' ')[0])&&norm(c.n).split(' ')[0].length>4);
  const regionM=REGIONES.find(r=>n.includes(norm(r)))||(n.includes('santiago')?'Metropolitana':null);
  if(/no se que estudiar|por donde empiezo|no se que/.test(n)) return `Buen punto de partida: <ul><li><a href="#test">Haz el test vocacional</a> (3 minutos).</li><li>Revisa tus resultados y guarda carreras en favoritos.</li><li>Usa <a href="#ranking">Mi ranking personal</a> con tu presupuesto y región.</li></ul>`;
  if(num&&/punto|puntaje|alcanza/.test(n)){
    const x=+num; const L=C.filter(c=>c.pond&&c.corte!=null&&x>=c.corte-30&&x>=c.min).sort((a,b)=>b.corte-a.corte);
    return `Comparando ${x} puntos ponderados con los cortes del año anterior (datos demo), estas carreras quedarían alcanzables o competitivas:<ul>${L.map(c=>`<li>${link(c)} (corte ${c.corte})</li>`).join('')||'<li>Ninguna con PAES; revisa admisión directa.</li>'}</ul>Además hay ${C.filter(c=>!c.pond).length} carreras con admisión directa. Para un cálculo exacto con ponderaciones, ingresa tus puntajes en <a href="#perfil">Mi perfil</a>.<div class="xs muted">${DISC_ADM}</div>`;
  }
  if(/diferencia|ip y|cft|instituto/.test(n)&&/universidad|ip|cft/.test(n)) return `<ul><li><b>Universidad:</b> entrega grados académicos (licenciatura, magíster) y títulos profesionales. Carreras de 8 a 14 semestres.</li><li><b>Instituto Profesional (IP):</b> entrega títulos profesionales sin licenciatura y títulos técnicos.</li><li><b>CFT:</b> entrega títulos técnicos de nivel superior, de 4 a 5 semestres.</li></ul>Algunas profesiones (como Medicina, Derecho o Psicología) solo pueden estudiarse en universidades.`;
  if(/gratis|gratuidad/.test(n)) return `Sí, si tu hogar está en el tramo de menores ingresos exigido (referencia: 60%) y estudias en una institución adscrita. En esta versión hay ${C.filter(c=>inst(c).gratuidad).length} carreras demo en instituciones con gratuidad. Prueba el <a href="#financiamiento">simulador de beneficios</a> y postula con el FUAS en beneficiosestudiantiles.cl.`;
  if(/paes/.test(n)&&/no quiero|sin/.test(n)) return `Puedes estudiar sin PAES en carreras con admisión directa:<ul>${C.filter(c=>!c.pond).slice(0,6).map(c=>`<li>${link(c)}</li>`).join('')}</ul>Revisa más en <a href="#alternativas">Otros caminos</a>.`;
  if(/no me alcanza|no quede|no quedo/.test(n)) return `Tienes varias opciones: lista de espera, admisión directa, vías especiales, partir por una carrera técnica o preparar una nueva PAES. Te lo explico en <a href="#alternativas">Otros caminos</a>.`;
  if(/tecnica primero|conviene.*tecnica/.test(n)) return `Puede convenir si quieres trabajar pronto o no estás seguro/a: te titulas en 2–2,5 años y luego puedes continuar estudios con articulación. Revisa <a href="#alternativas">carreras técnicas</a>.`;
  if(/empleabilidad|perspectiva|mejor pagad|laboral/.test(n)){const L=[...C].filter(c=>c.emp1!=null).sort((a,b)=>b.emp1-a.emp1).slice(0,5); if(!L.length) return 'La base cargada no incluye datos de empleabilidad. Se incorporarán desde MiFuturo.cl.'; return `Mayor empleabilidad al primer año (datos demo):<ul>${L.map(c=>`<li>${link(c)}: ${c.emp1}%</li>`).join('')}</ul><div class="xs muted">Son indicadores estadísticos, no garantías.</div>`;}
  if(/biologia|matematica|me gusta/.test(n)){const a=[]; if(/biolog/.test(n)) a.push('salud','cien'); if(/matemat/.test(n)) a.push('tec','neg'); if(/arte|dibuj/.test(n)) a.push('arte'); if(/historia|lenguaje/.test(n)) a.push('soc','der'); const L=C.filter(c=>a.includes(c.a)).slice(0,8); if(L.length) return `Con esos intereses podrías explorar:<ul>${L.map(c=>`<li>${link(c)}</li>`).join('')}</ul>El <a href="#test">test vocacional</a> te dará una orientación más completa.`;}
  if(carrera){
    const L=C.filter(c=>norm(c.n).split(' ')[0]===norm(carrera.n).split(' ')[0]&&(!regionM||inst(c).reg===regionM));
    if(/cuanto|cuesta|arancel|precio|vale/.test(n)) return `Costos de ${carrera.n} (datos demo):<ul>${L.map(c=>`<li>${link(c)}: arancel ${clp(c.arancel)} anual · costo total ${clp(costoTotal(c))}</li>`).join('')}</ul>`;
    return L.length?`Puedes estudiar ${carrera.n}${regionM?' en la Región '+regionM:''} en:<ul>${L.map(c=>`<li>${link(c)} · ${inst(c).com}</li>`).join('')}</ul>`:`No encontré ${carrera.n} en esa región en los datos actuales. <a href="#explorar">Busca en todas las regiones</a>.`;
  }
  return `No tengo una respuesta confiable para eso en los datos de la app, y prefiero no inventar. Prueba con <a href="#explorar">el buscador</a> o reformula tu pregunta (ej.: "¿Dónde estudiar Psicología?").`;
}

/* ================= BASE OFICIAL (INDICES CNED / SIES) ================= */
let DATA_MODE='demo', DATA_INFO=null; const DEMO_C=C.slice(), DEMO_INST=Object.assign({},INST);
const AREA_MAP=[['salud','salud'],['tecnolog','tec'],['social','soc'],['ffaa','ffaa'],['seguridad','ffaa'],['agricultura','agro'],['ciencias basicas','cien'],['ciencia','cien'],['educacion','edu'],['humanidad','soc'],['arte','arte'],['arquitect','arte'],['administracion','neg'],['comercio','neg'],['derecho','der'],['agro','agro'],['agropecuar','agro']];
function areaKey(s){const n=norm(s||''); for(const [k,a] of AREA_MAP) if(n.includes(k)) return a; return 'serv';}
function pick(row,names){for(const k of Object.keys(row)){const nk=norm(k).replace(/[^a-z0-9]/g,''); if(names.some(x=>nk===x||nk.startsWith(x))) return row[k];} return null;}
const num=x=>{if(x==null||x==='')return null; const n=+String(x).replace(/[^\d.-]/g,''); return isFinite(n)&&n>0?n:null;};
function mapRows(rows){
  const inst={}, out=[]; let id=1;
  for(const r of rows){
    const nom=pick(r,['nombreprograma','nombrecarrera','carrera']); const in_=pick(r,['nombreinstitucion','institucion']); if(!nom||!in_) continue;
    const nivel=String(pick(r,['pregradoposgrado','nivel'])||'pregrado'); if(/posgrado|postgrado/i.test(nivel)) continue;
    const ti=norm(pick(r,['tipoinstitucion'])||''); const t=ti.includes('universidad')?'U':ti.includes('instituto')?'IP':ti.includes('formacion')||ti.includes('cft')?'CFT':'U';
    const com=pick(r,['comuna'])||pick(r,['nombredelasede','sede'])||''; const reg=String(pick(r,['nombreregion','region'])||'').replace(/^Regi[oó]n (de |del |de la )?/i,'').trim();
    const key=norm(in_)+'|'+norm(com);
    if(!inst[key]) inst[key]={n:in_,t,reg:reg||'Información no disponible',com:com||'',acred:null,acredAreas:null,gratuidad:null,autonoma:null,residencias:false,vida:[]};
    const moneda=norm(pick(r,['tipodemoneda','moneda'])||'pesos'); const uf=moneda.includes('uf');
    const titulo=pick(r,['titulo'])||''; const grado=pick(r,['gradoacademico'])||null;
    const tipo = t==='CFT'||/tecnic/i.test(titulo) ? 'Técnica':'Profesional';
    const hor=String(pick(r,['horario','jornada'])||''); const jor=/vesp/i.test(hor)?'Vespertina':/diur/i.test(hor)?'Diurna':(hor||'Otra');
    const ment=pick(r,['mencionoespecialidad','mencion']);
    out.push({id:id++,n:String(nom).trim()+(ment&&norm(ment)!=='sin mencion'&&norm(ment)!=='no aplica'?' – '+ment:''),i:key,a:areaKey(pick(r,['areaconocimiento','area'])),generica:pick(r,['carreragenerica']),tipo,grado:grado&&!/sin grado|no aplica/i.test(grado)?grado:null,titulo:titulo||'Información no disponible',mod:null,jor,sem:num(pick(r,['duracionensemestres','duracion'])),real:null,
      arancel:uf?null:num(pick(r,['valordearancel','arancel'])),mat:uf?null:num(pick(r,['valordematricula','matricula'])),valTitulo:uf?null:num(pick(r,['valordeltitulo'])),uf,
      pond:null,admND:true,min:null,corte:null,cupos:num(pick(r,['vacantes'])),emp1:null,emp2:null,ing:null,acredCarrera:null,malla:null,practicas:null,perfil:null,sect:[],cont:null,sies:pick(r,['codigosies'])});
  }
  return {inst,out};
}
function loadOfficial(payload){
  const {inst,out,info}=payload;
  for(const k in INST) delete INST[k]; Object.assign(INST,inst);
  const meta={fuente:info.fuente,fecha:info.fecha,anio:info.anio,verif:'Fuente oficial',url:info.url};
  out.forEach(c=>{c.meta=meta; c.sect=c.sect||[]; c.admND=true;});
  for(const k in INST){ INST[k].vida=INST[k].vida||[]; if(info.fuenteGratuidad) INST[k].gratuidad=!!INST[k].gratuidad; }
  C.length=0; C.push(...out); DATA_MODE='oficial'; DATA_INFO=info;
  S.favs=S.favs.filter(id=>C.some(c=>c.id===id)); S.comp=[]; save();
  const regs=[...new Set(Object.values(INST).map(i=>i.reg))]; regs.forEach(r=>{if(!REGIONES.includes(r)&&r!=='Información no disponible') REGIONES.push(r);});
}
function restoreDemo(){for(const k in INST) delete INST[k]; Object.assign(INST,DEMO_INST); C.length=0; C.push(...DEMO_C); DATA_MODE='demo'; DATA_INFO=null; S.comp=[]; save(); idbDel();}
/* IndexedDB para conservar una base importada en este navegador */
function idb(){return new Promise((res,rej)=>{try{const q=indexedDB.open('etf',1);q.onupgradeneeded=()=>q.result.createObjectStore('d');q.onsuccess=()=>res(q.result);q.onerror=rej;}catch(e){rej(e)}});}
async function idbPut(v){try{const db=await idb();db.transaction('d','readwrite').objectStore('d').put(v,'oferta');}catch(e){}}
async function idbGet(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('d').objectStore('d').get('oferta');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}catch(e){return null}}
async function idbDel(){try{const db=await idb();db.transaction('d','readwrite').objectStore('d').delete('oferta');}catch(e){}}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX) return res(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s);});}
async function importFile(file){
  const out=$('#imp-out'); out.innerHTML='<div class="status info">⏳ Leyendo la planilla…</div>';
  try{
    await loadXLSX(); const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'});
    let best=null; for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:null}); if(!best||rows.length>best.length) best=rows;}
    // Algunas planillas oficiales traen filas de título antes del encabezado: buscar la fila que contiene "Nombre Institución"
    if(best && !Object.keys(best[0]||{}).some(k=>/instituci/i.test(k))){
      const sh=wb.Sheets[wb.SheetNames.find(n=>XLSX.utils.sheet_to_json(wb.Sheets[n]).length===best.length)]; const raw=XLSX.utils.sheet_to_json(sh,{header:1,defval:null});
      const hi=raw.findIndex(r=>r.some(c=>/nombre instituci/i.test(String(c||'')))); if(hi>=0){const hd=raw[hi]; best=raw.slice(hi+1).map(r=>Object.fromEntries(hd.map((h,i)=>[h||('c'+i),r[i]])));}
    }
    const {inst,out:rows}=mapRows(best||[]);
    if(!rows.length){out.innerHTML='<div class="status bad">No reconocí columnas de oferta académica (se esperan, por ejemplo, "Nombre Institución" y "Nombre Programa").</div>';return;}
    const info={fuente:$('#imp-src').value||'Planilla oficial importada',fecha:new Date().toISOString().slice(0,10),anio:+($('#imp-anio').value||new Date().getFullYear()),url:null,archivo:file.name};
    const payload={inst,out:rows,info}; loadOfficial(payload); idbPut(payload);
    out.innerHTML=`<div class="status ok">✓ ${rows.length.toLocaleString('es-CL')} programas de ${new Set(Object.values(inst).map(i=>i.n)).size} instituciones cargados.</div>`;
    setTimeout(()=>go('explorar'),900);
  }catch(e){out.innerHTML='<div class="status bad">No pude leer el archivo. Verifica que sea .xlsx o .csv.</div>';}
}
function vDatos(){
  const ni=new Set(Object.values(INST).map(i=>i.n)).size;
  const byT=t=>new Set(Object.values(INST).filter(i=>i.t===t).map(i=>i.n)).size;
  return `<h1>Base de datos</h1>
  <div class="bigstat ${DATA_MODE==='oficial'?'ok':'mid'} fx" style="margin-top:10px"><span class="e">${DATA_MODE==='oficial'?'✅':'🧪'}</span><div>${DATA_MODE==='oficial'?'Usando base oficial':'Usando datos de demostración'}<div class="xs" style="font-weight:500">${DATA_MODE==='oficial'?`${DATA_INFO.fuente} · cargada ${DATA_INFO.fecha}`:'Carreras e instituciones ficticias'}</div></div></div>
  <div class="rings">${ring(1,'#2D5BFF',`<span data-count="${C.length}">0</span>`,'Programas')}${ring(1,'#7B3FF2',`<span data-count="${ni}">0</span>`,'Instituciones')}${ring(1,'#14C8B8',`<span data-count="${new Set(Object.values(INST).map(i=>i.reg)).size}">0</span>`,'Regiones')}</div>
  <div class="mcard fx" style="margin-top:12px"><h3>Por tipo de institución</h3>${[['U','Universidades','#2D5BFF'],['IP','Institutos Profesionales','#7B3FF2'],['CFT','Centros de Formación Técnica','#14C8B8']].map(([t,n,col])=>`<div class="hrow"><span class="nm">${n}</span><div class="hb"><i data-w="${byT(t)/Math.max(1,ni)*100}%" style="background:${col}"></i></div><span class="vl">${byT(t)}</span></div>`).join('')}</div>
  ${window.IS_NATIVE?'':`<div class="mcard"><h3>📥 Cargar base oficial</h3>
   <p class="small" style="margin:6px 0 10px">Sube la planilla de oferta académica de pregrado (INDICES del CNED o Buscador de Carreras de MiFuturo/SIES). La app reconoce las columnas automáticamente.</p>
   <label class="xs muted" style="font-weight:700">Fuente (se mostrará en cada ficha)</label><input class="inp" id="imp-src" value="INDICES Educación Superior, Consejo Nacional de Educación — Oferta pregrado 2026">
   <label class="xs muted" style="font-weight:700;display:block;margin-top:8px">Año académico</label><input class="inp" id="imp-anio" type="number" value="2026">
   <input type="file" id="imp-file" accept=".xlsx,.xls,.csv" style="margin-top:12px">
   <div id="imp-out" style="margin-top:10px"></div>
   ${DATA_MODE==='oficial'?'<button class="btn ghost sm" style="margin-top:10px" data-demo>Volver a datos de demostración</button>':''}</div>`}
  ${DATA_MODE==='oficial'?`<div class="mcard"><h3>Fuentes</h3><p class="small" style="margin-top:6px">• Carreras: ${DATA_INFO.fuente}${DATA_INFO.url?` (<a href="${DATA_INFO.url}" target="_blank" rel="noopener">cned.cl</a>)`:''}<br>${DATA_INFO.fuenteAcred?'• Acreditación: '+DATA_INFO.fuenteAcred+'<br>':''}${DATA_INFO.fuenteGratuidad?`• Gratuidad: ${DATA_INFO.fuenteGratuidad}`:''}</p></div>`:''}
  <div class="disc">La base oficial trae: institución, sede, región, carrera, jornada, duración, título, grado, arancel, matrícula, costo de titulación y vacantes. <b>No trae</b> ponderaciones PAES, puntajes de corte, empleabilidad ni modalidad: esos datos se mostrarán como "Información no disponible" hasta cargarlos desde DEMRE, MiFuturo y CNA.</div>`;
}

/* ---------- Eventos ---------- */
function afterRender(view){ animate(document.getElementById('app')); }
function animate(root){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w);
    root.querySelectorAll('[data-ring]').forEach(el=>el.style.strokeDashoffset=el.dataset.ring);
    root.querySelectorAll('[data-left]').forEach(el=>el.style.left=el.dataset.left);
    root.querySelectorAll('.dots').forEach(el=>el.classList.add('go'));
    root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,f=el.dataset.fmt,t0=performance.now(),D=900;
      const fmt=x=>f==='mm'?mm(x):f==='pct'?Math.round(x)+'%':Math.round(x);
      (function step(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(step);})(t0);});
  }));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-open],[data-fav],[data-cmp],[data-close],[data-f],[data-falc],[data-toggle-filters],[data-clear],[data-ans],[data-back],[data-retest],[data-lastres],[data-usetest],[data-saveperfil],[data-wipe],[data-sim],[data-reg],[data-ask],[data-share],[data-clearcmp],[data-favcmp],[data-tab],[data-area],[data-tools],[data-more],[data-demo]');
  if(!t) return;
  const d=t.dataset;
  if(d.fav){e.stopPropagation(); const id=+d.fav; S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id]; save(); toast(S.favs.includes(id)?'Guardada en favoritos':'Quitada de favoritos'); refresh(id); return;}
  if(d.cmp){e.stopPropagation(); const id=+d.cmp; if(S.comp.includes(id)) S.comp=S.comp.filter(x=>x!==id); else { if(S.comp.length>=4){toast('Máximo 4 carreras para comparar');return;} S.comp.push(id);} save(); toast(S.comp.includes(id)?'Agregada al comparador':'Quitada del comparador'); refresh(id); return;}
  if(d.close!==undefined){ if(t.classList.contains('sheet-bg')&&e.target!==t) return; closeSheet(); if(t.tagName==='A') return; return;}
  if(d.open){e.preventDefault(); ficha(+d.open); return;}
  if(d.tab){FTAB=d.tab; ficha(FID); const tb=document.querySelector('.tabs'); if(tb) tb.scrollIntoView({block:'nearest'}); return;}
  if(d.area){const k=d.area; if(cur()==='explorar'){F.areas=F.areas.includes(k)?F.areas.filter(x=>x!==k):[...F.areas,k];} else {F.areas=[k];} closeSheet(); go('explorar'); return;}
  if(d.tools!==undefined){toolsSheet(); return;}
  if(d.more!==undefined){const y=window.scrollY; LIM+=30; render(); window.scrollTo(0,y); return;}
  if(d.demo!==undefined){restoreDemo(); toast('Volviste a los datos de demostración'); render(); return;}
  if(d.go){closeSheet(); go(d.go); return;}
  if(d.toggleFilters!==undefined){filtersSheet(); return;}
  if(d.f){LIM=30; const g=d.f; F[g]=F[g].includes(d.v)?F[g].filter(x=>x!==d.v):[...F[g],d.v]; render(); if(SHEET==='filters') filtersSheet(); return;}
  if(d.falc!==undefined){F.alcance=!F.alcance; render(); return;}
  if(d.clear!==undefined){F={q:'',areas:[],tipoInst:[],tipo:[],costo:[],reg:'',mod:[],jor:[],alcance:false,orden:'rel',open:false}; render(); return;}
  if(d.ans!==undefined){const o=TEST[T.i].o[+d.ans]; T.hist=T.hist||[]; T.hist.push(o[2]); for(const k in o[2]) T.sc[k]=(T.sc[k]||0)+o[2][k]; T.i++; if(T.i>=TEST.length){const dur=['_corta','_media','_larga'].find(k=>T.sc[k])||'_media'; S.test={sc:T.sc,dur,fecha:new Date().toISOString()}; save(); T.view='res';} render(); return;}
  if(d.back!==undefined){const last=T.hist.pop(); for(const k in last) T.sc[k]-=last[k]; T.i--; render(); return;}
  if(d.retest!==undefined){T={i:0,sc:{}}; render(); return;}
  if(d.lastres!==undefined){T={i:TEST.length,sc:S.test.sc}; render(); return;}
  if(d.usetest!==undefined){go('ranking'); return;}
  if(d.saveperfil!==undefined){document.querySelectorAll('[data-p]').forEach(i=>S.perfil[i.dataset.p]=i.value); const bad=['nem','rank','cl','m1'].some(k=>!S.perfil[k]); save(); if(bad) toast('Completa al menos NEM, Ranking, Competencia Lectora y M1'); render(); return;}
  if(d.wipe!==undefined){S={favs:[],comp:[],perfil:{nem:'',rank:'',cl:'',m1:'',m2:'',cien:'',hist:'',region:'',presupuesto:'',modalidad:'',areas:[]},test:null,checks:{}}; try{localStorage.removeItem(LS);}catch(e){} T={i:0,sc:{}}; toast('Tus datos fueron borrados'); render(); return;}
  if(d.sim!==undefined){simular(); return;}
  if(d.reg){MAPREG=MAPREG===d.reg?'':d.reg; render(); return;}
  if(d.ask){ask(d.ask); return;}
  if(d.share!==undefined){const txt=shareText(); if(window.NativeBridge&&NativeBridge.share){NativeBridge.share(txt).catch(()=>{}); return;} try{navigator.clipboard.writeText(txt).then(()=>toast('Resumen copiado. Pégalo en WhatsApp o correo.'),()=>showText(txt));}catch(err){showText(txt);} return;}
  if(d.clearcmp!==undefined){S.comp=[]; save(); render(); return;}
  if(d.favcmp!==undefined){S.comp=S.favs.slice(0,4); save(); go('comparar'); return;}
});
function showText(txt){$('#sheet-root').innerHTML=`<div class="sheet-bg" data-close><div class="sheet" style="padding:16px"><h3>Copia este resumen</h3><textarea class="inp" rows="8" style="margin-top:8px">${esc(txt)}</textarea><button class="btn pri" style="margin-top:8px" data-close>Cerrar</button></div></div>`;}
function refresh(id){ const open=SHEET==='ficha'; render(); if(open) ficha(FID||id); }
function ask(q){ CHAT.push({b:0,h:esc(q)}); CHAT.push({b:1,h:responder(q)}); render(); const ch=$('#chat'); if(ch) ch.lastElementChild.scrollIntoView({block:'end'}); }
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='home-search'){F.q=$('#hq').value; go('explorar');}
  if(e.target.id==='ex-search'){LIM=30; F.q=$('#exq').value; render();}
  if(e.target.id==='chatf'){const q=$('#chatq').value.trim(); if(q) ask(q);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='freg'){F.reg=t.value; render(); if(SHEET==='filters') filtersSheet();}
  if(t.id==='forden'){F.orden=t.value; render(); if(SHEET==='filters') filtersSheet();}
  if(t.dataset.pref){S.perfil[t.dataset.pref]=t.value; save();}

document.addEventListener('keydown',e=>{if(e.key==='Escape') closeSheet();});
render();

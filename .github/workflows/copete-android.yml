name: Compilar app Android

on:
  push:
    branches: [main]
    paths: ["copete-club-android/**", ".github/workflows/copete-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copete-club-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compilar AAB (sin firmar; se firma con la llave de subida fuera de CI)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: copete-club-release
          path: |
            copete-club-android/app/build/outputs/bundle/release/*.aab
      - name: Guardar el AAB en la rama copete-android-build
        working-directory: .
        run: |
          mkdir -p /tmp/out && cp copete-club-android/app/build/outputs/bundle/release/*.aab /tmp/out/app-release-unsigned.aab
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan copete-android-build
          git rm -rq --cached .
          cp /tmp/out/app-release-unsigned.aab .
          git add app-release-unsigned.aab
          git commit -qm "AAB sin firmar de ${GITHUB_SHA::7}"
          git push -f origin copete-android-build

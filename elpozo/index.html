<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>El Pozo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#ece5d3;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  #intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));
    background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.15) 0,rgba(0,0,0,.78) 72%);transition:opacity .8s}
  #intro.hide{opacity:0;pointer-events:none}
  h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:48px;letter-spacing:.06em;text-shadow:0 2px 20px #000}
  #intro p{margin:0;max-width:300px;line-height:1.45;font-size:15px;color:#d8d0bb;text-shadow:0 1px 10px #000}
  #go{margin-top:10px;font:600 17px system-ui,sans-serif;color:#15140f;background:#e9dfc4;border:0;border-radius:999px;
    padding:14px 34px;box-shadow:0 6px 30px rgba(0,0,0,.6);cursor:pointer}
  #go:active{transform:scale(.97)}
  #ui{position:fixed;z-index:4;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    display:flex;gap:8px;opacity:0;transition:opacity .6s}
  #ui.show{opacity:1}
  #ui button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,8,.5);
    color:#e9dfc4;font-size:19px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #ui button.off{opacity:.45}
  #ui button:focus-visible,#go:focus-visible{outline:2px solid #e9dfc4;outline-offset:3px}
  #toast{position:fixed;z-index:4;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:rgba(10,10,8,.68);border:1px solid rgba(255,255,255,.14);padding:10px 16px;border-radius:14px;font-size:14px;
    text-align:center;max-width:86vw;width:max-content;opacity:0;transition:opacity .4s;pointer-events:none;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #toast.show{opacity:1}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9;background:#000;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro">
  <h1>El Pozo</h1>
  <p>Inclina el celular para asomarte al fondo.<br>Toca la pantalla para dejar caer una piedra.</p>
  <button id="go">Asomarse</button>
  <p style="margin-top:18px;font-size:13px"><a href="privacidad.html" style="color:#ece5d3">Privacidad</a></p>
</div>
<div id="ui">
  <button id="bCal" aria-label="Recalibrar" title="Recalibrar posición">◎</button>
  <button id="bInv" aria-label="Invertir movimiento" aria-pressed="false" title="Invertir movimiento">⇄</button>
  <button id="bSnd" aria-label="Sonido" aria-pressed="true" title="Sonido">♪</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="err">Este dispositivo no soporta WebGL, necesario para dibujar el pozo.</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uCam;
uniform vec3 uTgt;
uniform float uFl;
uniform vec4 uStone;
uniform vec4 uRip[8];

#define PI 3.14159265
#define RW 1.0
#define RC 1.48
#define HC 1.05
#define DEPTH 22.0
#define NC 15.0
#define ROWH 0.27
const vec3 SUN = vec3(0.3773, 0.8984, 0.2246);

float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float h31(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float noise2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
float noise3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(mix(h31(i), h31(i+vec3(1,0,0)), f.x), mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x), mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z); }
float fbm2(vec2 p){ float s = 0., a = .5; for(int i=0;i<4;i++){ s += a*noise2(p); p = p*2.03 + 17.1; a *= .5; } return s; }
float fbm3(vec3 p){ float s = 0., a = .5; for(int i=0;i<3;i++){ s += a*noise3(p); p = p*2.07 + vec3(1.7,9.2,3.1); a *= .5; } return s; }

// fracción de sol que entra por la boca del pozo hasta el punto p
// cuerpo del observador (cabeza, hombros, torso) para sombra y reflejo
float bodyCover(vec3 o, vec3 d){
  float c = 1.;
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    vec3 cc = uCam + vec3(0., -.12 - fi * .3, .2 + fi * .22);
    float rr = i == 0 ? .17 : (i == 1 ? .26 : .3);
    float t = dot(cc - o, d);
    if (t > 0.) { float dd = length(o + d * t - cc); c *= smoothstep(rr - .02, rr + .06, dd); }
  }
  return c;
}
float sunVis(vec3 p){
  float s = (HC - p.y) / SUN.y;
  vec2 q = p.xz + SUN.xz * s;
  float v = 1. - smoothstep(RW - 0.05, RW, length(q));
  if (v > 0.) v *= bodyCover(p, SUN);
  return v;
}

// piedra de campo irregular (voronoi periódico alrededor del pozo)
vec4 voro(vec2 x, float per){
  vec2 n = floor(x), f = fract(x);
  float d1 = 8., d2 = 8.; vec2 mr = vec2(0.); float id = 0.;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 c = n + g; c.x = mod(c.x, per);
    vec2 o = vec2(h21(c), h21(c + 19.7)) * .8 + .1;
    vec2 r = g + o - f;
    float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; mr = r; id = h21(c + 5.3); } else if (d < d2) { d2 = d; }
  }
  return vec4(sqrt(d2) - sqrt(d1), id, -mr);
}

vec3 shadeWall(vec3 p, vec3 rd, float dist){
  float fp = dist / (uFl * min(uRes.x, uRes.y));
  float det = 1. - smoothstep(0.009, 0.035, fp);
  float a = atan(p.z, p.x); float a01 = a / (2. * PI) + .5;
  float d = HC - p.y;
  vec3 n0 = -vec3(cos(a), 0., sin(a));
  vec3 T = vec3(-sin(a), 0., cos(a)); vec3 B = vec3(0., 1., 0.);

  vec4 v = voro(vec2(a01 * 21., p.y / .2), 21.);
  float mortar = mix(.15, 1. - smoothstep(.02, .07, v.x), det);
  float bev = mix(.7, smoothstep(.04, .5, v.x), det);
  float r0 = fbm3(p * 5.);
  vec3 pf = p * 16.;
  float nC = noise3(pf), nT = noise3(pf + T * .45), nB = noise3(pf + B * .45);
  float nC2 = noise3(pf * 3.1), nT2 = noise3(pf * 3.1 + T * .5);
  vec2 fine = (vec2(nT - nC, nB - nC) * 1.3 + vec2(nT2 - nC2, 0.) * .6) * det;
  vec2 dome = v.zw * vec2(1., .7) * (1.15 - bev * .6) * (1. - mortar) * det;
  vec3 n = normalize(n0 + T * (dome.x * 1.3 + fine.x) + B * (dome.y * 1.3 + fine.y));

  // color de cada piedra: grises, ocres, pizarra
  vec3 base = mix(vec3(.26, .24, .21), vec3(.44, .4, .34), v.y);
  float k = fract(v.y * 7.13);
  if (k < .2) base *= vec3(1.15, .95, .75);
  else if (k < .35) base *= vec3(.8, .85, .92);
  else if (k > .9) base *= vec3(.65, .62, .6);
  base *= mix(.65, 1.25, r0) * (.85 + .3 * nC2 * det + .15 * (1. - det));
  vec3 alb = mix(base, vec3(.2, .185, .16) * (.6 + .7 * r0), mortar);

  // musgo y líquenes: arriba (luz) y abajo (humedad), más en las juntas
  float mossN = fbm3(p * 2.2 + 5.);
  float zone = smoothstep(3., .3, d) * .8 + smoothstep(DEPTH - 6., DEPTH, d) * 1.2 + mortar * .35;
  float moss = smoothstep(.45, .68, mossN * zone + mortar * .1 * smoothstep(10., 1., d));
  alb = mix(alb, vec3(.09, .16, .04) * (.6 + .8 * r0), moss);
  float lich = smoothstep(.62, .72, fbm3(p * 7. + 3.)) * smoothstep(5., 1., d) * (1. - mortar);
  alb = mix(alb, vec3(.55, .56, .45), lich * .45);

  // filtraciones: hilos de agua que bajan y manchas de humedad
  float col = floor(a01 * 64.); float hc = h21(vec2(col, 7.));
  float trk = 0.;
  if (hc > .8) {
    float cx = fract(a01 * 64.) - .5;
    float wob = (noise3(vec3(col, p.y * 1.3, 0.)) - .5) * .8;
    trk = smoothstep(.2, 0., abs(cx + wob)) * smoothstep(.4, 2.5, d) * (.4 + .6 * hc);
  }
  float damp = smoothstep(.45, .7, fbm3(vec3(p.x * 1.2, p.y * .25, p.z * 1.2)));
  float wet = clamp(max(smoothstep(DEPTH - 7., DEPTH - .5, d), max(trk, damp * smoothstep(1.5, 6., d) * .7)), 0., 1.);
  alb *= mix(1., .45, wet);

  // luz
  float vis = sunVis(p);
  float ndl = max(dot(n, SUN), 0.);
  float sky = 1. / (1. + .38 * d * d);
  float bounce = .045 * exp(-d * .35) + .004;
  float ao = mix(.3, 1., bev) * (1. - mortar * .45);
  float cau = noise3(vec3(p.x * 5., p.y * 2.5 - uTime * .25, p.z * 5. + uTime * .35));
  float waterLight = smoothstep(DEPTH - 3., DEPTH, d) * (.2 + .8 * pow(cau, 3.)) * .02;
  vec3 L = vec3(1., .9, .76) * 2.6 * vis * ndl
         + vec3(.6, .64, .7) * sky * (.65 + .35 * max(n.y, 0.)) * ao
         + vec3(.8, .72, .6) * bounce * ao
         + vec3(.5, .65, .75) * waterLight;
  vec3 c = alb * L;

  // brillo húmedo: la piedra mojada refleja el círculo de cielo de la boca
  vec3 rr = reflect(rd, n);
  float env = 0.;
  if (rr.y > 0.) {
    float s = (HC - p.y) / rr.y; vec2 q = p.xz + rr.xz * s;
    env = 1. - smoothstep(RW - .08, RW, length(q));
  }
  float fres = .04 + .96 * pow(1. - max(dot(n, -rd), 0.), 5.);
  float gloss = mix(.08, 1., wet) * (1. - moss * .7);
  c += vec3(.75, .82, .95) * 1.6 * env * fres * gloss;
  vec3 h = normalize(SUN - rd);
  c += vec3(1., .95, .85) * pow(max(dot(n, h), 0.), 60.) * vis * gloss * 2.;
  float glint = trk * pow(.5 + .5 * sin(p.y * 7. + uTime * 4.5 + hc * 40.), 14.) * det;
  c += vec3(.9, .95, 1.) * glint * (sky * .3 + bounce * .5);
  return c;
}

vec3 skyCol(vec3 d){
  d.y = max(d.y, .02);
  vec3 c = mix(vec3(.62, .74, .88), vec3(.26, .46, .8), clamp(d.y, 0., 1.));
  vec2 cp = d.xz / d.y * .9 + vec2(uTime * .025, uTime * .014);
  float cl = smoothstep(.42, .78, fbm2(cp * 1.6));
  c = mix(c, vec3(.96, .96, .98), cl * .9);
  float sd = max(dot(d, SUN), 0.);
  c += vec3(1., .9, .7) * (pow(sd, 700.) * 25. + pow(sd, 10.) * .25);
  return c * 1.5;
}

float cylExit(vec3 o, vec3 d, float r){
  float a = dot(d.xz, d.xz); if (a < 1e-7) return 1e5;
  float b = dot(o.xz, d.xz); float c = dot(o.xz, o.xz) - r * r;
  return (-b + sqrt(max(b * b - a * c, 0.))) / a;
}


float capHit(vec3 ro, vec3 rd, vec3 pa, vec3 pb, float r){
  vec3 ba = pb - pa, oa = ro - pa;
  float baba = dot(ba, ba), bard = dot(ba, rd), baoa = dot(ba, oa), rdoa = dot(rd, oa), oaoa = dot(oa, oa);
  float a = baba - bard * bard, b = baba * rdoa - baoa * bard, c = baba * oaoa - baoa * baoa - r * r * baba;
  float h = b * b - a * c;
  if (h >= 0.) {
    float t = (-b - sqrt(h)) / a; float y = baoa + t * bard;
    if (y > 0. && y < baba) return t;
    vec3 oc = (y <= 0.) ? oa : ro - pb; b = dot(rd, oc); c = dot(oc, oc) - r * r; h = b * b - c;
    if (h > 0.) return -b - sqrt(h);
  }
  return -1.;
}
vec3 shadeRope(vec3 pos, vec3 rd, vec3 pa, vec3 pb, float r){
  vec3 ba = pb - pa, pa2 = pos - pa;
  float hh = clamp(dot(pa2, ba) / dot(ba, ba), 0., 1.);
  vec3 n = normalize(pa2 - hh * ba);
  float along = hh * length(ba);
  vec3 ax = normalize(ba); vec3 side = normalize(cross(ax, vec3(.3, .1, .9)));
  float ang = atan(dot(n, cross(ax, side)), dot(n, side));
  float strand = .5 + .5 * sin(along * 140. + ang * 3.);
  float fib = noise3(pos * 220.);
  vec3 alb = vec3(.42, .33, .2) * (.55 + .45 * strand) * (.8 + .4 * fib);
  float d = HC - pos.y;
  alb *= mix(1., .45, smoothstep(DEPTH - 8., DEPTH, d));
  float sky = 1. / (1. + .38 * max(d, 0.) * max(d, 0.));
  float vis = sunVis(pos);
  vec3 L = vec3(1., .9, .76) * 2.6 * vis * max(dot(n, SUN), 0.) + vec3(.6, .64, .7) * sky * (.6 + .4 * strand) + .006;
  return alb * L;
}

float waterH(vec2 w){
  float t = uTime;
  float h = .0025 * sin(w.x * 6. + t * 1.1) + .0025 * sin(w.y * 7.3 - t * .9) + .0015 * sin((w.x + w.y) * 13. + t * 1.9);
  for (int i = 0; i < 8; i++) {
    vec4 r = uRip[i]; float age = t - r.z;
    if (age > 0. && age < 6.) {
      float dd = length(w - r.xy); float fr = age * .42;
      float env = exp(-age * .8) * exp(-(dd - fr) * (dd - fr) * 14.) * r.w;
      h += .028 * env * sin(dd * 42. - age * 15.);
    }
  }
  return h;
}

vec3 shadeWater(vec3 p, vec3 rd){
  vec2 w = p.xz; float e = .004;
  float h0 = waterH(w);
  vec3 n = normalize(vec3(-(waterH(w + vec2(e, 0.)) - h0) / e, 1., -(waterH(w + vec2(0., e)) - h0) / e));
  vec3 rr = reflect(rd, n); rr.y = max(rr.y, .02); rr = normalize(rr);
  float tc = cylExit(p, rr, RW * .999);
  vec3 q = p + rr * tc;
  vec3 rc = q.y < HC ? shadeWall(q, rr, 60.) : skyCol(rr);
  float F = .22 + .78 * pow(1. - max(dot(n, -rd), 0.), 5.);
  float d = DEPTH;
  float sky = 1. / (1. + .2 * d * d);
  vec3 deep = vec3(.03, .06, .05) * (sky + .012);
  vec3 c = mix(deep, rc, F);

  // hojas flotando
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    vec2 cc = vec2(cos(uTime * .045 + fi * 2.1) * (.35 + .15 * fi), sin(uTime * .037 + fi * 2.1) * (.4 + .1 * fi));
    float an = uTime * .08 + fi * 2.;
    vec2 lq = w - cc; lq = mat2(cos(an), -sin(an), sin(an), cos(an)) * lq;
    float Ls = .085 - fi * .012;
    float wd = .036 * max(0., 1. - pow(lq.x / Ls, 2.)) * (1. - fi * .1);
    float m = smoothstep(.004, 0., abs(lq.y) - wd);
    vec3 lc = mix(vec3(.45, .24, .07), vec3(.55, .42, .12), fract(fi * .53)) * (1. - .5 * smoothstep(.006, 0., abs(lq.y)));
    c = mix(c, lc * (sky * 1.2 + .03), m);
  }
  // espuma del chapoteo
  for (int i = 0; i < 8; i++) {
    vec4 r = uRip[i]; float age = uTime - r.z;
    if (age > 0. && age < .6 && r.w > .7) {
      float dd = length(w - r.xy);
      c += vec3(.5, .55, .55) * smoothstep(.06 + age * .2, 0., dd) * (1. - age / .6) * .25;
    }
  }
  return c;
}

vec3 shadeTop(vec3 p){
  float r = length(p.xz);
  float a = atan(p.z, p.x); float a01 = a / (2. * PI) + .5;
  if (r < RC) {
    // brocal: losas de piedra grandes e irregulares
    vec4 v = voro(vec2(a01 * 12., (r - RW) / (RC - RW) * 1.4), 12.);
    float gap = 1. - smoothstep(.012, .045, v.x);
    float bev = smoothstep(.03, .35, v.x);
    float r0 = fbm3(p * 5.) * .6 + fbm3(p * 17.) * .3 + noise3(p * 50.) * .1;
    vec3 alb = mix(vec3(.25, .23, .19), vec3(.42, .38, .31), v.y) * mix(.55, 1.3, r0);
    if (fract(v.y * 5.7) < .25) alb *= vec3(1.12, .96, .8);
    float lich = smoothstep(.55, .72, fbm3(p * 3.5 + 2.));
    alb = mix(alb, vec3(.6, .62, .5), lich * .5);
    float moss = smoothstep(.55, .78, fbm3(p * 4. + 9.) + gap * .3);
    alb = mix(alb, vec3(.1, .18, .05), moss * .75);
    vec3 rad = vec3(cos(a), 0., sin(a)), tan = vec3(-sin(a), 0., cos(a));
    vec3 pf = p * 18.;
    float nC = noise3(pf), nX = noise3(pf + vec3(.5, 0., 0.)), nZ = noise3(pf + vec3(0., 0., .5));
    float lip = 1. - smoothstep(RW, RW + .12, r);
    float lipO = smoothstep(RC - .1, RC, r);
    vec3 n = normalize(vec3(0., 1., 0.) + vec3(nX - nC, 0., nZ - nC) * 1.4
             + (tan * v.z + rad * v.w * .5) * (1. - bev) * .9
             - rad * lip * 1.6 + rad * lipO * 1.2);
    float ndl = max(dot(n, SUN), 0.) * bodyCover(p, SUN);
    vec3 c = alb * (vec3(1., .9, .76) * 2.6 * ndl + vec3(.6, .64, .7) * .5) * mix(.45, 1., bev) * mix(1., .55, lip);
    return mix(c, vec3(.015, .014, .01), gap);
  }
  // suelo: tierra y pasto que se mueve con el viento
  vec2 w = p.xz;
  float g = fbm2(w * 1.3);
  float tuft = fbm2(w * 4.5);
  float blades = noise3(vec3(w * 38., uTime * .7 + w.x * 2.));
  float blades2 = noise2(w * 90. + vec2(uTime * .4, 0.));
  vec3 grass = mix(vec3(.07, .13, .03), vec3(.2, .26, .07), blades) * (.7 + .5 * blades2);
  vec3 dirt = mix(vec3(.17, .13, .09), vec3(.26, .21, .15), noise2(w * 25.));
  vec3 alb = mix(dirt, grass * (.6 + .8 * tuft), smoothstep(.38, .6, g + (r - RC) * .25));
  float peb = smoothstep(.9, .95, noise2(w * 9.)) * (1. - smoothstep(.38, .6, g));
  alb = mix(alb, vec3(.5, .47, .42), peb);
  float ao = smoothstep(RC, RC + .35, r) * .6 + .4;
  vec3 n = normalize(vec3((blades - .5) * .6, 1., (blades2 - .5) * .6));
  float ndl = max(dot(n, SUN), 0.) * bodyCover(p, SUN);
  // sombra del brocal sobre el suelo
  float sh = 1. - smoothstep(RC + .02, RC - .12, length(w - SUN.xz * (-HC / SUN.y))) * 0.;
  return alb * (vec3(1., .92, .8) * 2.4 * ndl * sh + vec3(.55, .66, .82) * .55) * ao;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - .5 * uRes) / min(uRes.x, uRes.y);
  vec3 ro = uCam;
  vec3 f = normalize(uTgt - ro);
  vec3 r = normalize(cross(f, vec3(0., 1., 0.)));
  vec3 u = cross(r, f);
  vec3 rd = normalize(f * uFl + r * uv.x + u * uv.y);

  vec3 col; float tHit = 1e5;
  float tTop = (HC - ro.y) / rd.y;
  vec3 pt = ro + rd * tTop; float rt = length(pt.xz);
  bool inWell = rt < RW && rd.y < 0.;
  if (inWell) {
    float tw = tTop + cylExit(pt, rd, RW);
    vec3 pw = ro + rd * tw;
    if (pw.y > -DEPTH) { tHit = tw; col = shadeWall(pw, rd, tw); }
    else { tHit = (-DEPTH - ro.y) / rd.y; col = shadeWater(ro + rd * tHit, rd); }
  } else if (rt < RC) {
    tHit = tTop; col = shadeTop(pt);
  } else if (rd.y < -.005) {
    tHit = -ro.y / rd.y; col = shadeTop(ro + rd * tHit);
  } else { col = skyCol(rd) * .6; }


  // cuerda amarrada al brocal que baja hasta el agua
  {
    float sw = sin(uTime * .55) * .035 + sin(uTime * .31) * .02;
    vec3 a0 = vec3(-1.27, HC + .05, -.56), a1 = vec3(-.905, HC + .03, -.4), a2 = vec3(-.86 + sw, -DEPTH + .15, -.37 + sw * .5);
    float rr = .019;
    float t1 = capHit(ro, rd, a0, a1, rr), t2 = capHit(ro, rd, a1, a2, rr);
    if (t1 > 0. && t1 < tHit) { tHit = t1; col = shadeRope(ro + rd * t1, rd, a0, a1, rr); }
    if (t2 > 0. && t2 < tHit) { tHit = t2; col = shadeRope(ro + rd * t2, rd, a1, a2, rr); }
    // estaca de fierro
    float ts = capHit(ro, rd, vec3(-1.3, HC - .02, -.57), vec3(-1.3, HC + .12, -.57), .028);
    if (ts > 0. && ts < tHit) { tHit = ts; vec3 ps = ro + rd * ts; vec3 n = normalize(vec3(ps.x + 1.3, 0., ps.z + .57));
      col = vec3(.2, .11, .06) * (.6 + .5 * noise3(ps * 90.)) * (vec3(1., .9, .76) * 2.6 * max(dot(n, SUN), 0.) * bodyCover(ps, SUN) + .35); }
  }

  // piedra cayendo
  if (uStone.w > .5) {
    vec3 oc = ro - uStone.xyz; float rad = .055;
    float b = dot(oc, rd); float c = dot(oc, oc) - rad * rad; float h = b * b - c;
    if (h > 0.) {
      float ts = -b - sqrt(h);
      if (ts > 0. && ts < tHit) {
        vec3 ps = ro + rd * ts; vec3 n = normalize(ps - uStone.xyz);
        float d = HC - ps.y;
        float sky = 1. / (1. + .2 * max(d, 0.) * max(d, 0.));
        vec3 alb = vec3(.42, .4, .37) * (.7 + .5 * noise3(n * 6.));
        col = alb * (vec3(1., .92, .8) * 2.4 * max(dot(n, SUN), 0.) * sunVis(ps) + vec3(.55, .66, .82) * sky + .03);
        tHit = ts;
      }
    }
  }

  // rayos de sol y polvo flotando
  if (inWell) {
    float t0 = tTop, t1 = min(tHit, tTop + 7.);
    float stp = (t1 - t0) / 12.;
    float acc = 0.;
    float jit = h21(gl_FragCoord.xy);
    for (int i = 0; i < 12; i++) {
      vec3 sp = ro + rd * (t0 + (float(i) + jit) * stp);
      float v = sunVis(sp);
      if (v > 0.) {
        float dn = noise3(sp * 11. + vec3(uTime * .05, uTime * .18, -uTime * .07));
        acc += v * (.1 + 3. * pow(dn, 16.));
      }
    }
    col += vec3(1., .9, .72) * acc * stp * .05;
  }

  // tono, viñeta y grano
  col *= 1.15;
  col = col / (1. + col) * 1.15;
  col = pow(col, vec3(.4545));
  float vg = smoothstep(1.25, .35, length(uv * vec2(.95, .8)));
  col *= mix(.55, 1., vg);
  col += (h21(gl_FragCoord.xy + fract(uTime * 7.3) * 113.) - .5) * .015;
  gl_FragColor = vec4(col, 1.);
}
</script>

<script>
(() => {
"use strict";
const HC = 1.05, DEPTH = 22.0;
const DEPTH_M = 18, G = 9.8;

const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, powerPreference: 'high-performance' }) ||
           cv.getContext('experimental-webgl');
if (!gl) { document.getElementById('err').style.display = 'flex'; document.getElementById('intro').style.display = 'none'; return; }

const vsSrc = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(prog));
  document.getElementById('err').style.display = 'flex'; document.getElementById('intro').style.display = 'none'; return;
}
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
['uRes', 'uTime', 'uCam', 'uTgt', 'uFl', 'uStone', 'uRip'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

// ---------- Resolución adaptativa ----------
let W, H, scale = Math.min(window.devicePixelRatio || 1, 1.5), maxScale = scale;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.max(1, Math.round(W * scale)); cv.height = Math.max(1, Math.round(H * scale));
  gl.viewport(0, 0, cv.width, cv.height);
}
window.addEventListener('resize', resize);
resize();
let ftAcc = 0, ftN = 0;
function adapt(dtMs) {
  ftAcc += dtMs; ftN++;
  if (ftN >= 40) {
    const avg = ftAcc / ftN; ftAcc = 0; ftN = 0;
    if (avg > 26 && scale > 0.45) { scale = Math.max(0.45, scale * 0.85); resize(); }
    else if (avg < 15 && scale < maxScale) { scale = Math.min(maxScale, scale * 1.08); resize(); }
  }
}

// ---------- Estado ----------
const tilt = { x: 0, y: 0 }, tgt = { x: 0, y: 0 };
let started = false, gotSensor = false, calib = true, bx = 0, by = 0, lastInput = 0;
let invert = false, sound = true;
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
try { invert = localStorage.getItem('pozo.inv') === '1'; } catch (e) {}
try { sound = localStorage.getItem('pozo.snd') !== '0'; } catch (e) {}
if (invert) { document.getElementById('bInv').classList.add('off'); document.getElementById('bInv').setAttribute('aria-pressed', 'true'); }
if (!sound) { document.getElementById('bSnd').classList.add('off'); document.getElementById('bSnd').setAttribute('aria-pressed', 'false'); }
const rip = new Float32Array(32); let ripIdx = 0;
for (let i = 0; i < 8; i++) rip[i * 4 + 2] = -100;
let stone = null;
const t0 = performance.now(); let time = 0, last = t0;

// persona inclinada sobre el brocal: el celular decide cuánto se asoma
function view() {
  const s = invert ? -1 : 1;
  const side = tilt.x * s, lean = -tilt.y * s;
  const breath = Math.sin(time * 1.5) * 0.012;
  const sway = RM ? 0 : Math.sin(time * 0.37) * 0.025 + Math.sin(time * 0.23 + 1) * 0.018;
  const pos = [side * 0.35 + sway, 1.98 + breath - Math.max(0, lean) * 0.1, 0.74 - lean * 0.26];
  const pitch = (63 + lean * 15) * Math.PI / 180, yaw = -side * 0.22 + sway * 0.3;
  const dir = [Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)];
  const tgt = [pos[0] + dir[0] * 5, pos[1] + dir[1] * 5, pos[2] + dir[2] * 5];
  const fl = RM ? 0.95 : 0.95 + Math.sin(time * 0.21) * 0.035;   // leve efecto vértigo
  return { pos, tgt, fl };
}

function addRipple(x, z, strength) {
  rip.set([x, z, time, strength], ripIdx * 4);
  ripIdx = (ripIdx + 1) % 8;
}

function frame(now) {
  const dtMs = now - last; last = now;
  const dt = Math.min(0.05, dtMs / 1000);
  time = (now - t0) / 1000;
  adapt(dtMs);

  if (!started || (!gotSensor && time - lastInput > 4)) {
    const a = started ? 0.18 : 0.4;
    tgt.x = Math.sin(time * 0.35) * a; tgt.y = Math.cos(time * 0.27) * a * 0.8;
  }
  const k = 1 - Math.pow(0.002, dt);
  tilt.x += (tgt.x - tilt.x) * k; tilt.y += (tgt.y - tilt.y) * k;

  let st = [0, 0, 0, 0];
  if (stone) {
    const t = time - stone.t0;
    if (t >= stone.T) {
      addRipple(stone.x, stone.z, 1);
      splash(stone.T);
      stone = null;
    } else {
      const g = 2 * (HC + DEPTH) / (stone.T * stone.T);
      st = [stone.x, HC - 0.5 * g * t * t, stone.z, 1];
    }
  }

  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uTime, time);
  const v = view();
  gl.uniform3fv(U.uCam, v.pos);
  gl.uniform3fv(U.uTgt, v.tgt);
  gl.uniform1f(U.uFl, v.fl);
  gl.uniform4fv(U.uStone, st);
  gl.uniform4fv(U.uRip, rip);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

// rayo desde el toque hasta la boca del pozo (misma cámara que el shader)
function tapToWell(px, py) {
  const v = view(); const ro = v.pos, fl = v.fl;
  const m = Math.min(W, H);
  const ux = (px - W / 2) / m, uy = -(py - H / 2) / m;
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const nrm = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const f = nrm(sub(v.tgt, ro));
  const r = nrm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  const rd = nrm([f[0] * fl + r[0] * ux + u[0] * uy, f[1] * fl + r[1] * ux + u[1] * uy, f[2] * fl + r[2] * ux + u[2] * uy]);
  if (rd[1] > -0.01) return [0, 0];
  const t = (HC - ro[1]) / rd[1];
  let x = ro[0] + rd[0] * t, z = ro[2] + rd[2] * t;
  const L = Math.hypot(x, z); if (L > 0.8) { x *= 0.8 / L; z *= 0.8 / L; }
  return [x, z];
}

function dropStone(px, py) {
  if (stone) return;
  const [x, z] = tapToWell(px, py);
  stone = { x, z, t0: time, T: Math.sqrt(2 * DEPTH_M / G) };
  whoosh();
}

function splash(T) {
  plop(1);
  if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
  toast(`Tardó ${T.toFixed(1).replace('.', ',')} s en caer · unos ${Math.round(0.5 * G * T * T)} m de profundidad`);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ---------- Entrada ----------
function setTarget(x, y) { const L = Math.hypot(x, y); if (L > 1) { x /= L; y /= L; } tgt.x = x; tgt.y = y; lastInput = time; }
let down = null;
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, tx: tgt.x, ty: tgt.y, moved: false }; });
window.addEventListener('pointermove', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down.moved = true;
  if (!started || gotSensor) return;
  const sc = Math.min(W, H) * 0.45;
  if (e.pointerType === 'mouse' && !down) setTarget((e.clientX - W / 2) / sc, (e.clientY - H / 2) / sc);
  else if (down) setTarget(down.tx + (e.clientX - down.x) / sc, down.ty + (e.clientY - down.y) / sc);
});
window.addEventListener('pointerup', e => { if (down && !down.moved && started) dropStone(e.clientX, e.clientY); down = null; });
window.addEventListener('pointercancel', () => { down = null; });

function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  gotSensor = true;
  const b = e.beta, g = e.gamma;
  const ang = (screen.orientation && screen.orientation.angle != null) ? screen.orientation.angle : (window.orientation || 0);
  let x, y;
  if (ang === 90) { x = b; y = -g; } else if (ang === -90 || ang === 270) { x = -b; y = g; }
  else if (ang === 180) { x = -g; y = -b; } else { x = g; y = b; }
  if (calib) { bx = x; by = y; calib = false; }
  bx += (x - bx) * 0.0015; by += (y - by) * 0.0015;
  if (started) setTarget((x - bx) / 26, (y - by) / 26);
}
async function enableSensor() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() === 'denied') return false;
    }
    window.addEventListener('deviceorientation', onOrient);
    return true;
  } catch (e) { return false; }
}

// ---------- Sonido ----------
let AC = null, master, verb;
function initAudio() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = sound ? 0.9 : 0; master.connect(AC.destination);
    verb = AC.createConvolver();
    const len = Math.floor(AC.sampleRate * 3.4), b = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / AC.sampleRate;
        let v = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3) * 0.5;
        if (t % 0.16 < 0.004) v += (Math.random() * 2 - 1) * Math.exp(-t * 1.3) * 1.4;
        d[i] = v;
      }
    }
    verb.buffer = b;
    const wet = AC.createGain(); wet.gain.value = 0.55; verb.connect(wet); wet.connect(master);
    // viento suave de fondo
    const nb = AC.createBuffer(1, AC.sampleRate * 4, AC.sampleRate), nd = nb.getChannelData(0);
    let lastv = 0; for (let i = 0; i < nd.length; i++) { lastv = lastv * 0.98 + (Math.random() * 2 - 1) * 0.02; nd[i] = lastv * 6; }
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    const wg = AC.createGain(); wg.gain.value = 0.05;
    const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 0.035;
    lfo.connect(lg); lg.connect(wg.gain);
    ns.connect(lp); lp.connect(wg); wg.connect(master); wg.connect(verb);
    ns.start(); lfo.start();
  } catch (e) { AC = null; }
}
function out(node, dry) { const g = AC.createGain(); g.gain.value = dry; node.connect(g); g.connect(master); node.connect(verb); }
function plop(vol) {
  if (!AC || !sound) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(780 + Math.random() * 300, t);
  o.frequency.exponentialRampToValueAtTime(140, t + 0.14);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.6 * vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(g); out(g, 0.45); o.start(t); o.stop(t + 0.3);
  const n = AC.createBufferSource(), nb = AC.createBuffer(1, AC.sampleRate * 0.2, AC.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
  n.buffer = nb;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = 0.8;
  const ng = AC.createGain(); ng.gain.value = 0.35 * vol;
  n.connect(bp); bp.connect(ng); out(ng, 0.4); n.start(t);
}
function whoosh() {
  if (!AC || !sound) return;
  const t = AC.currentTime, dur = 1.2;
  const n = AC.createBufferSource(), nb = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  n.buffer = nb;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2200, t); lp.frequency.exponentialRampToValueAtTime(300, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(lp); lp.connect(g); out(g, 0.6); n.start(t);
}
function scheduleDrip() {
  setTimeout(() => {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.85;
    addRipple(Math.cos(a) * r, Math.sin(a) * r, 0.35);
    if (started) plop(0.16);
    scheduleDrip();
  }, 2500 + Math.random() * 5000);
}
scheduleDrip();

// ---------- Botones ----------
document.getElementById('go').addEventListener('click', async e => {
  e.stopPropagation();
  initAudio();
  if (AC && AC.state === 'suspended') { try { await AC.resume(); } catch (er) {} }
  const ok = await enableSensor();
  calib = true; started = true; lastInput = time; tgt.x = 0; tgt.y = 0;
  document.getElementById('intro').classList.add('hide');
  document.getElementById('ui').classList.add('show');
  setTimeout(() => {
    if (gotSensor) toast('Inclina el celular · toca para soltar una piedra');
    else if (!ok) toast('Sin permiso de movimiento: arrastra el dedo para mirar');
    else toast('Sin sensor de movimiento: arrastra el dedo o mueve el mouse');
  }, 1200);
});
document.getElementById('bCal').addEventListener('click', e => { e.stopPropagation(); calib = true; tgt.x = 0; tgt.y = 0; toast('Posición recalibrada'); });
document.getElementById('bInv').addEventListener('click', e => {
  e.stopPropagation(); invert = !invert; e.currentTarget.classList.toggle('off', invert); e.currentTarget.setAttribute('aria-pressed', String(invert));
  try { localStorage.setItem('pozo.inv', invert ? '1' : '0'); } catch (er) {}
  toast(invert ? 'Movimiento invertido' : 'Movimiento normal');
});
document.getElementById('bSnd').addEventListener('click', e => {
  e.stopPropagation(); sound = !sound; e.currentTarget.classList.toggle('off', !sound); e.currentTarget.setAttribute('aria-pressed', String(sound));
  try { localStorage.setItem('pozo.snd', sound ? '1' : '0'); } catch (er) {}
  if (master) master.gain.value = sound ? 0.9 : 0;
  toast(sound ? 'Sonido activado' : 'Sonido silenciado');
});
['bCal', 'bInv', 'bSnd'].forEach(id => {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => e.stopPropagation());
  b.addEventListener('pointerup', e => e.stopPropagation());
});

document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  try { if (document.hidden) AC.suspend(); else if (started) AC.resume(); } catch (e) {}
});
cv.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  const el = document.getElementById('err');
  el.textContent = 'El teléfono liberó la memoria gráfica. Toca para volver a cargar el pozo.';
  el.style.display = 'flex'; el.addEventListener('click', () => location.reload(), { once: true });
});
cv.addEventListener('webglcontextrestored', () => location.reload());
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>

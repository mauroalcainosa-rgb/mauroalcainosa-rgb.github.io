<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0620">
<title>PARTY SHOTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0620;--bg2:#140a3a;--fu:#ff2bd6;--pu:#8b5cf6;--or:#ff8a00;--ye:#ffe600;--cy:#22d3ee;--gr:#39ff14;--rd:#ff3b6b;--tx:#f5f0ff;--mu:#a99cd6;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body.big{font-size:19px}
body.big .btn{font-size:1.15rem}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Outfit,system-ui,sans-serif;overflow-x:hidden;padding:var(--safe-area-inset-top,env(safe-area-inset-top)) var(--safe-area-inset-right,env(safe-area-inset-right)) calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + var(--banner-h,0px)) var(--safe-area-inset-left,env(safe-area-inset-left))}
body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:-30%;z-index:-1;background:
 radial-gradient(circle at 20% 20%,rgba(255,43,214,.28),transparent 35%),
 radial-gradient(circle at 80% 30%,rgba(139,92,246,.30),transparent 35%),
 radial-gradient(circle at 50% 85%,rgba(34,211,238,.18),transparent 35%),
 radial-gradient(circle at 85% 80%,rgba(255,138,0,.18),transparent 30%),var(--bg);
 animation:disco 14s ease-in-out infinite alternate}
@keyframes disco{0%{transform:rotate(0) scale(1)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:rotate(-6deg) scale(1.02)}}
.wrap{max-width:540px;margin:0 auto;padding:0 14px 40px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.top h2{flex:1;margin:0;font:400 1.05rem Bungee,sans-serif;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ye);text-shadow:0 0 10px rgba(255,230,0,.5)}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:1.25rem;display:grid;place-items:center;cursor:pointer;position:relative}
.ib .badge{position:absolute;top:-4px;right:-4px;background:var(--fu);color:#fff;border-radius:10px;font-size:.7rem;font-weight:800;padding:1px 6px}
.btn{font:800 1rem Outfit,sans-serif;border:0;border-radius:16px;padding:14px 16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pu),var(--fu));box-shadow:0 0 18px rgba(255,43,214,.35);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ok{background:linear-gradient(135deg,#16a34a,#39ff14);color:#062}
.btn.bad{background:linear-gradient(135deg,#be123c,var(--rd))}
.btn.or{background:linear-gradient(135deg,var(--or),var(--ye));color:#2a1200;box-shadow:0 0 18px rgba(255,138,0,.4)}
.btn.cy{background:linear-gradient(135deg,#0891b2,var(--cy));color:#032;box-shadow:0 0 18px rgba(34,211,238,.4)}
.btn.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%}
.btn.mega{width:100%;font:400 1.5rem Bungee,sans-serif;padding:20px;border-radius:22px;background:linear-gradient(135deg,var(--fu),var(--or));animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(255,43,214,.5)}50%{box-shadow:0 0 38px rgba(255,138,0,.9)}}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.hero{text-align:center;padding:18px 0 6px}
.logo{font:400 3.3rem/0.95 Bungee,sans-serif;color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--fu),0 0 36px var(--fu)}
.logo span{color:var(--ye);text-shadow:0 0 6px #fff,0 0 18px var(--or),0 0 40px var(--or)}
.tag{color:var(--mu);margin:10px 0 0}
.neon{font:400 1.45rem Bungee,sans-serif;text-align:center;color:var(--cy);text-shadow:0 0 12px var(--cy);margin:18px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{position:relative;border-radius:20px;padding:16px 14px;min-height:118px;background:var(--card);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile:active{transform:scale(.98)}
.tile .e{font-size:2.2rem}
.tile b{font-size:1.02rem;line-height:1.15}
.tile small{color:var(--mu)}
.tile.wide{grid-column:1/-1;min-height:90px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.tile .fav{position:absolute;top:8px;right:10px;font-size:1.2rem;background:none;border:0;color:var(--ye);cursor:pointer}
.strip{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px dashed var(--line);cursor:pointer;overflow-x:auto}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;flex:none;border:3px solid}
.foot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.foot button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:10px 4px;font:600 .8rem Outfit;cursor:pointer}
.foot button span{display:block;font-size:1.4rem}
.ad{margin-top:16px;border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:10px;text-align:center;color:#6f63a0;font-size:.75rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.prompt{font:800 1.5rem/1.25 Outfit;text-align:center;padding:26px 18px;border-radius:22px;background:linear-gradient(160deg,rgba(139,92,246,.25),rgba(255,43,214,.18));border:1px solid rgba(255,43,214,.45);box-shadow:0 0 24px rgba(139,92,246,.25);margin:12px 0;animation:pop .35s}
body.big .prompt{font-size:1.9rem}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.kicker{display:block;font:400 .8rem Bungee;letter-spacing:.06em;color:var(--ye);margin-bottom:10px}
.who{display:flex;align-items:center;justify-content:center;gap:10px;font:800 1.3rem Outfit;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 13px;font:600 .92rem Outfit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:linear-gradient(135deg,var(--pu),var(--fu));border-color:transparent;box-shadow:0 0 12px rgba(255,43,214,.45)}
.chip .n{background:rgba(0,0,0,.35);border-radius:10px;padding:0 7px;font-weight:800}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:700 .85rem Outfit;padding:9px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--pu),var(--fu));color:#fff}
label.lb{display:block;font-weight:700;margin:14px 0 6px;color:var(--mu);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],textarea,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px;font:600 1rem Outfit}
textarea{min-height:140px;resize:vertical}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.pitem .nm{flex:1;font-weight:800;font-size:1.05rem}
.pitem .sc{font:400 1rem Bungee;color:var(--ye)}
.x{background:none;border:0;color:var(--mu);font-size:1.3rem;cursor:pointer;padding:4px 8px}
.wheelbox{position:relative;width:min(92vw,400px);margin:10px auto}
.wheelbox canvas{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 0 22px rgba(255,43,214,.45))}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--ye);filter:drop-shadow(0 0 8px var(--ye));z-index:2}
.result{min-height:60px}
.scorerow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.scorerow .btn{flex:1;padding:12px 8px;font-size:.92rem}
.die{width:150px;height:150px;margin:20px auto;border-radius:28px;background:linear-gradient(145deg,#fff,#e6dcff);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:18px;box-shadow:0 0 30px rgba(255,230,0,.5),inset 0 -6px 0 rgba(0,0,0,.12)}
.die span{display:grid;place-items:center}.die .pip::after{content:"";width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6be6,#9b0f86);box-shadow:0 0 6px rgba(255,43,214,.6)}
.die.roll{animation:roll .12s linear infinite}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(14deg) scale(1.06)}100%{transform:rotate(-10deg) scale(.96)}}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.88rem;color:var(--mu)}
.faces div{background:var(--card);border-radius:10px;padding:7px 9px}.faces div.hl{background:rgba(255,230,0,.18);color:var(--ye);font-weight:800}
.flip{perspective:1200px;width:min(80vw,300px);height:400px;margin:14px auto;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.flip .f{background:repeating-linear-gradient(45deg,#2a0f5c 0 14px,#1b0940 14px 28px);border:3px solid var(--fu);box-shadow:0 0 26px rgba(255,43,214,.5)}
.flip .f .logo{font-size:2.1rem}
.flip .b{transform:rotateY(180deg);background:linear-gradient(160deg,#1f0b4d,#3b0d5e);border:3px solid var(--ye);box-shadow:0 0 26px rgba(255,230,0,.45)}
.flip .b .ct{font:400 1.05rem Bungee;color:var(--ye);margin-bottom:6px}.flip .b .ce{font-size:3rem}.flip .b p{font:800 1.25rem/1.3 Outfit}
.rr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.rr button{aspect-ratio:3/4;border-radius:18px;border:2px solid var(--fu);background:repeating-linear-gradient(45deg,#2a0f5c 0 10px,#1b0940 10px 20px);color:var(--ye);font:400 2rem Bungee;cursor:pointer;box-shadow:0 0 14px rgba(255,43,214,.35)}
.rr button.used{opacity:.25}
.timer{--p:1;width:120px;height:120px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--ye) calc(var(--p)*360deg),rgba(255,255,255,.08) 0);box-shadow:0 0 22px rgba(255,230,0,.35)}
.timer b{width:96px;height:96px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:400 2.4rem Bungee}
.timer.warn{background:conic-gradient(var(--rd) calc(var(--p)*360deg),rgba(255,255,255,.08) 0);animation:shake .3s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.counter{font:400 4rem Bungee;text-align:center;color:var(--cy);text-shadow:0 0 18px var(--cy)}
.muted{color:var(--mu)}.center{text-align:center}.small{font-size:.85rem}
.note{font-size:.82rem;color:var(--mu);text-align:center;margin-top:10px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0}
.podium div{flex:1;text-align:center;border-radius:16px 16px 6px 6px;padding:10px 6px;background:var(--card);border:1px solid var(--line)}
.podium .p1{min-height:200px;border-color:var(--ye);box-shadow:0 0 22px rgba(255,230,0,.4)}.podium .p2{min-height:165px}.podium .p3{min-height:140px}.podium div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:0}.podium div>div{border:0;background:none;padding:0;min-height:0;box-shadow:none}
.award{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card);margin:8px 0}
.award .e{font-size:1.6rem}
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,2,18,.82);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
#modal.on{display:flex}
.mbox{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:linear-gradient(160deg,#1a0b45,#120733);border:1px solid rgba(255,43,214,.45);border-radius:22px;padding:20px;box-shadow:0 0 40px rgba(139,92,246,.4);animation:pop .25s}
.mbox h3{font:400 1.2rem Bungee;color:var(--ye);margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);z-index:60;background:#1f0b4d;border:1px solid var(--fu);padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .3s;box-shadow:0 0 20px rgba(255,43,214,.4);max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.libmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.libmeta div{background:var(--card);border-radius:12px;padding:8px 10px;font-size:.88rem}.libmeta b{display:block;color:var(--ye);font-size:.72rem;text-transform:uppercase}
.lib h4{margin:16px 0 4px;color:var(--cy)}.lib p,.lib li{line-height:1.45}
.hist{font-size:.9rem;border-bottom:1px solid var(--line);padding:8px 0}.hist small{color:var(--mu)}
.gate{text-align:center;padding-top:6vh}
.rules{text-align:left;font-size:.92rem;line-height:1.5}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.sw{width:54px;height:30px;border-radius:20px;background:#3a2c66;position:relative;cursor:pointer;flex:none;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:linear-gradient(135deg,var(--pu),var(--fu))}.sw.on::after{left:27px}
.code{font-family:ui-monospace,monospace;font-size:.8rem;word-break:break-all}

/* ---- animaciones extra ---- */
#bgfx,#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgfx{z-index:-1}#cf{z-index:70}
#scr{animation:scrIn .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.grid .tile,.plist .pitem,.chips .chip{animation:fadeUp .5s both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tile{transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px)}
.tile .e{display:inline-block;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*200ms)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-6deg)}}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);transform:translateX(-120%);animation:sheen 5s infinite;animation-delay:calc(var(--i,0)*400ms)}
@keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn.mega{position:relative;overflow:hidden}
.btn.mega::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.logoWrap{display:flex;flex-direction:column;align-items:center}
.logoSvg{width:170px;height:auto;overflow:visible}
.logoSvg .ring{transform-origin:110px 105px;animation:spinR 14s linear infinite}
.logoSvg .ring2{transform-origin:110px 105px;animation:spinR 9s linear infinite reverse}
@keyframes spinR{to{transform:rotate(360deg)}}
.logoSvg .glassG{transform-origin:110px 170px;animation:tilt 3.2s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.logoSvg .wave{animation:wave 1.6s linear infinite}
@keyframes wave{to{transform:translateX(-60px)}}
.logoSvg .bub{animation:bub 2.4s ease-in infinite;opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
.logoSvg .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.wordmark{font:400 2.9rem/0.95 Bungee,sans-serif;text-align:center;margin-top:4px}
.wordmark .wa{color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--fu),0 0 40px var(--fu);animation:flicker 4s infinite}
.wordmark .wb{color:var(--ye);text-shadow:0 0 6px #fff,0 0 18px var(--or),0 0 44px var(--or);letter-spacing:.04em}
.wordmark .wb span{display:inline-block;animation:jump 2.4s ease-in-out infinite}
@keyframes jump{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px) scale(1.1)}}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}
.eq{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:26px;margin:10px 0 0}
.eq i{width:6px;border-radius:3px;background:linear-gradient(var(--ye),var(--fu));animation:eq 1s ease-in-out infinite;box-shadow:0 0 8px rgba(255,43,214,.6)}
@keyframes eq{0%,100%{height:5px}50%{height:26px}}
.neon{animation:neonP 2.2s ease-in-out infinite}
@keyframes neonP{0%,100%{text-shadow:0 0 10px var(--cy)}50%{text-shadow:0 0 22px var(--cy),0 0 40px var(--cy);color:#a5f3fc}}
.wheelbox{animation:wglow 2s ease-in-out infinite}
@keyframes wglow{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 18px rgba(255,230,0,.35))}}
.pointer{animation:pbounce 1s ease-in-out infinite}
@keyframes pbounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
.prompt{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.who .av{animation:avPop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes avPop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.flip .f{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flip .f .logoSvg{width:120px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

.adban{margin-top:16px;min-height:60px}
.ad{transition:opacity .4s}
.adbox{margin:14px 0;border-radius:18px;padding:30px 16px;background:repeating-linear-gradient(135deg,#1f0b4d 0 16px,#26105c 16px 32px);border:1px dashed rgba(255,255,255,.3);text-align:center}
.adbox b{display:block;font:400 1.2rem Bungee;color:var(--cy);margin-bottom:6px}
.lock{position:absolute;top:10px;right:12px;font-size:1.2rem}
.tile.locked{opacity:.85}
.tile.premium{border-color:#ffe60088;box-shadow:inset 0 0 30px #ffe60022}

.btn.rainbow{position:relative;width:100%;font:400 1.55rem Bungee,sans-serif;padding:22px 16px;border-radius:24px;color:#fff;
 background:linear-gradient(90deg,#ff2bd6,#ff8a00,#ffe600,#39ff14,#22d3ee,#8b5cf6,#ff2bd6);background-size:300% 100%;
 animation:rbMove 3s linear infinite,rbGlow 1.2s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.4);overflow:hidden;border:3px solid #fff}
.btn.rainbow small{display:block;font:800 .8rem Outfit;letter-spacing:.08em;opacity:.95;margin-top:4px}
.btn.rainbow .dice{display:inline-block;animation:diceSpin 1.6s ease-in-out infinite}
.btn.rainbow::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 2s infinite}
@keyframes rbMove{to{background-position:300% 0}}
@keyframes rbGlow{0%,100%{box-shadow:0 0 18px rgba(255,43,214,.7),0 0 40px rgba(255,230,0,.35);transform:scale(1)}50%{box-shadow:0 0 34px rgba(34,211,238,.9),0 0 70px rgba(255,43,214,.6);transform:scale(1.03)}}
@keyframes diceSpin{0%,60%{transform:rotate(0)}80%{transform:rotate(200deg) scale(1.25)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>
<canvas id="bgfx"></canvas><canvas id="cf"></canvas>
<script>

let ac=null;
function AC(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==='suspended')ac.resume().catch(()=>{});return ac}
function tone(f,d,type='sine',v=.15,when=0){if(!S.settings.sound)return;const a=AC();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+when;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
const sfx={tick:()=>tone(1300,.03,'square',.04),beep:()=>tone(880,.12,'sine',.2),buzz:()=>tone(130,.55,'sawtooth',.18),win:()=>{confetti(90);[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.16,i*.1))},flip:()=>{tone(380,.08,'triangle',.1);tone(760,.1,'triangle',.1,.06)},dice:()=>{for(let i=0;i<7;i++)tone(180+Math.random()*320,.04,'square',.07,i*.08)},pop:()=>tone(660,.07,'sine',.12)};
const music={id:null,start(){const a=AC();if(!a||this.id)return;let s=0;this.id=setInterval(()=>{const t=a.currentTime;if(s%4===0){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.22)}if(s%2===1){const b=a.createBuffer(1,a.sampleRate*.05,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=b;f.type='highpass';f.frequency.value=7000;g.gain.value=.08;n.connect(f).connect(g).connect(a.destination);n.start(t)}if(s%8===0){const bs=[55,55,65.4,49][Math.floor(s/8)%4];const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=bs;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.5)}s++},125)},stop(){clearInterval(this.id);this.id=null}};

function drinkShot(p,reason){
 if(!p)return;const alc=S.settings.alcohol,lim=S.settings.shotLimit;let title,sub;
 if(!alc){title='¡TOMA UN SORBO!';sub='Sorbo de agua o bebida 💧'}
 else if((p.shots=p.shots||0)>=lim){title='¡CASTIGO CON AGUA!';sub=`${esc(p.name)} ya llegó a su límite de ${lim} shots esta partida: ahora le toca agua o un desafío 💧`}
 else{p.shots++;save();title='¡TOMA UN SHOT!';sub=`Shot ${p.shots} de ${lim} esta partida 🥃`}
 log('Shot',p.name+(reason?' ('+reason+')':'')+': '+title);
 tone(1568,.12,'triangle',.2);tone(2093,.25,'triangle',.18,.08);
 modal(`<div class="center"><span class="kicker">${esc(reason||'Perdiste')}</span><div style="transform:scale(.85);margin:-6px 0">${logoSVG()}</div>${whoHTML(p,'Castigo para')}<div class="wordmark" style="font-size:1.9rem"><div class="wb">${title}</div></div><p class="muted">${sub}</p><button class="btn mega" onclick="closeModal()">🥂 ¡SALUD!</button></div>`)}

/* puntuación */
function scoreRow(p){
 if(!p)return `<div class="scorerow"><button class="btn ghost" onclick="this.disabled=true;sfx.win()">✅ ¡Hecho!</button></div>`;
 if(!S.settings.competitive)return `<div class="scorerow"><button class="btn ok" onclick="award('${p.id}',0,'done',this)">✅ ¡Hecho!</button><button class="btn bad" onclick="award('${p.id}',0,'fail',this)">❌ No cumplió 🥃</button></div>`;
 return `<div class="scorerow"><button class="btn ok" onclick="award('${p.id}',1,'win',this)">✅ Cumplió +1</button><button class="btn bad" onclick="award('${p.id}',-1,'fail',this)">❌ No cumplió 🥃</button><button class="btn ghost" onclick="award('${p.id}',0,'creative',this)">⭐ Creativo</button></div>`}
function award(id,pts,kind,btn){
 const p=S.players.find(x=>x.id===id);if(!p)return;
 p.score+=pts;if(kind==='win')p.wins++;if(kind==='fail')p.fails++;if(kind==='creative')p.creative++;save();
 if(btn){if(kind==='creative')btn.disabled=true;else btn.parentElement.querySelectorAll('button').forEach(b=>{if(!b.textContent.includes('Creativo'))b.disabled=true})}
 if(pts>0||kind==='done'||kind==='creative'){sfx.win()}else if(pts<0)sfx.buzz();
 toast(kind==='creative'?`⭐ ${p.name} suma creatividad`:pts?`${p.name}: ${pts>0?'+':''}${pts} punto${Math.abs(pts)>1?'s':''} (total ${p.score})`:'¡Bien hecho!');
 const b=document.querySelector('.ib .badge');if(b)b.textContent=S.players.length;
 if(kind==='fail')drinkShot(p,'No cumplió')}
function addPts(p,pts,kind,reason){if(!p)return;if(kind==='fail')drinkShot(p,reason||'Perdiste');if(!S.settings.competitive)return;p.score+=pts;if(kind==='win')p.wins++;if(kind==='fail')p.fails++;save()}

/* ruleta */
const WCOLS=['#ff2bd6','#8b5cf6','#ff8a00','#ffe600','#22d3ee','#39ff14','#ff3b6b','#4d7cff'];
function makeWheel(canvas,items){
 const ctx=canvas.getContext('2d');let size=0,rot=0,spinning=false,phase=0,raf=null;
 function setup(){const dpr=window.devicePixelRatio||1;size=canvas.clientWidth||320;canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
 function draw(){
  const n=items.length,seg=2*Math.PI/n,r=size/2;ctx.clearRect(0,0,size,size);ctx.save();ctx.translate(r,r);
  for(let i=0;i<n;i++){const a0=rot+i*seg;let c=WCOLS[i%WCOLS.length];if(i===n-1&&n>1&&c===WCOLS[0])c=WCOLS[2];
   ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-8,a0,a0+seg);ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#0a0620';ctx.lineWidth=3;ctx.stroke();
   ctx.save();ctx.rotate(a0+seg/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle=['#ffe600','#39ff14','#22d3ee','#ff8a00'].includes(c)?'#1a0833':'#fff';
   const fs=Math.max(10,Math.min(16,size/25,240/n+5));ctx.font=`800 ${fs}px Outfit, sans-serif`;let t=String(items[i]);const maxw=r-58;if(ctx.measureText(t).width>maxw){while(t.length>3&&ctx.measureText(t+'…').width>maxw)t=t.slice(0,-1);t=t.trim()+'…'}ctx.fillText(t,r-20,0);ctx.restore()}
  ctx.beginPath();ctx.arc(0,0,r-5,0,2*Math.PI);ctx.lineWidth=7;ctx.strokeStyle='#1a0833';ctx.stroke();
  for(let k=0;k<24;k++){const a=k*2*Math.PI/24;ctx.beginPath();ctx.arc(Math.cos(a)*(r-5),Math.sin(a)*(r-5),3.6,0,2*Math.PI);ctx.fillStyle=((k+Math.floor(phase))%2)?'#fff':'#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0}
  ctx.beginPath();ctx.arc(0,0,28,0,2*Math.PI);ctx.fillStyle='#0a0620';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#ff2bd6';ctx.stroke();
  ctx.fillStyle='#ffe600';ctx.font='400 13px Bungee, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GIRA',0,1);
  ctx.restore()}
 function spin(idx,done){
  if(spinning||!items.length)return;spinning=true;const n=items.length,seg=2*Math.PI/n,TAU=2*Math.PI;
  const jitter=(Math.random()-.5)*seg*.7,target=-Math.PI/2-(idx+.5)*seg+jitter;let delta=(((target-rot)%TAU)+TAU)%TAU;delta+=TAU*(5+Math.floor(Math.random()*3));
  const start=rot,dur=4200+Math.random()*1200,t0=performance.now();let last=null;
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);rot=start+delta*e;phase+=.25;draw();
   const cs=Math.floor(((((-Math.PI/2-rot)%TAU)+TAU)%TAU)/seg);if(cs!==last){last=cs;sfx.tick()}
   if(p<1)raf=requestAnimationFrame(step);else{spinning=false;rot=rot%TAU;done&&done(idx)}};
  raf=requestAnimationFrame(step)}
 setup();draw();
 const idle=setInterval(()=>{if(!spinning){phase+=1;draw()}},500);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{setup();draw()});
 cleanups.push(()=>{clearInterval(idle);cancelAnimationFrame(raf)});
 return {spin,get spinning(){return spinning},setItems(v){items=v;draw()}}}

/* acción a partir de un texto de ruleta/dado */
function actionFor(text,p){
 const t=text.toLowerCase();const l=S.settings.intensity;
 if(t.includes('shot')||t.includes('sorbo')||t.includes('elige quién toma')){const drink=S.settings.alcohol?'un shot (de lo que quieras: agua o bebida también valen)':'un sorbo de agua o bebida';const alt=S.settings.alcohol?' Si prefieres no tomar alcohol, cámbialo por un desafío.':'';const o=S.players.filter(x=>!p||x.id!==p.id);
  if(t.includes('todos'))return {k:'Shot',x:'¡Todos toman '+drink+'! Salud 🥂'+alt};
  if(t.includes('con quien')||t.includes('pareja'))return {k:'Shot',x:'Elige a alguien y tomen juntos '+drink+(o.length?' (sugerencia: '+rnd(o).name+')':'')+'.'+alt};
  if(t.includes('elige quién'))return {k:'Shot',x:'Elige a otro jugador para que tome '+drink+'.'+alt};
  if(t.includes('pierde'))return {k:'Shot',x:'¡Perdiste! Toma '+drink+'.'+alt};
  return {k:'Shot',x:'Toma '+drink+'.'+alt}}const lv=Math.min(3,Math.max(1,l===4?3:l));
 if(t.includes('pregunta'))return {k:'Verdad',x:rnd(TRUTH[lv])};
 if(t.includes('desafío')||t.includes('desafio')||t.includes('reto'))return {k:'Desafío',x:rnd(DARE[lv])};
 if(t.includes('imitación')||t.includes('imitacion'))return {k:'Imitación',x:rnd(CARD_TYPES['Imitación'].t)};
 if(t.includes('anécdota')||t.includes('anecdota'))return {k:'Anécdota',x:rnd(['Cuenta tu anécdota más vergonzosa del colegio','Cuenta la historia de tu peor viaje','Cuenta cómo conociste a alguien de esta mesa','Cuenta la fiesta más épica a la que has ido','Cuenta la vez que más te reíste en tu vida'])};
 if(t.includes('penitencia'))return {k:'Penitencia',x:rnd(PENANCES)};
 if(t.includes('competencia'))return {k:'Competencia',x:rnd(CARD_TYPES['Competencia'].t)};
 if(t.includes('compañero')||t.includes('otro participante')||t.includes('elegir a')||t.includes('elige a otro')){const others=S.players.filter(x=>!p||x.id!==p.id);return {k:'Elige',x:'Elige a otro jugador: hará la próxima prueba'+(others.length?' (o deja que la app elija: '+rnd(others).name+')':'')}}
 if(t.includes('seleccionar un jugador')||t.includes('elige jugador')){const q=pickPlayer();return {k:'Jugador',x:q?`¡${q.name} hace la próxima prueba!`:'Agrega jugadores para sortear'}}
 if(t.includes('sin alcohol'))return {k:'Alternativa',x:'Elige la versión sin alcohol: agua, bebida o un sorbo simbólico de jugo'};
 if(t.includes('sorteo'))return actionFor(rnd(['pregunta','desafío','imitación','anécdota','competencia']),p);
 return null}

  if(o.s){x.save();x.translate(o.x,o.y);x.rotate(o.p);const r=o.r*2.2;x.beginPath();for(let k=0;k<8;k++){const rr=k%2?r*.35:r;x.lineTo(Math.cos(k*Math.PI/4)*rr,Math.sin(k*Math.PI/4)*rr)}x.fill();x.restore()}
  else{x.beginPath();x.arc(o.x,o.y,o.r,0,6.28);x.fill()}});x.globalAlpha=1;x.shadowBlur=0}requestAnimationFrame(loop)};loop()})();

const confetti=(function(){const c=document.getElementById('cf'),x=c.getContext('2d');let P=[],run=false;
 const cols=['#ff2bd6','#8b5cf6','#ff8a00','#ffe600','#22d3ee','#39ff14','#fff'];
 function frame(){x.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.y<c.height+20&&p.life-->0);
  P.forEach(p=>{p.vy+=.18;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,6.28);x.fill()}else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));x.restore()});
  if(P.length)requestAnimationFrame(frame);else{run=false;x.clearRect(0,0,c.width,c.height)}}
 return function(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;c.width=innerWidth;c.height=innerHeight;n=n||110;
  for(let i=0;i<n;i++){const side=i%2;P.push({x:side?c.width*.85:c.width*.15,y:c.height*.65,vx:(side?-1:1)*(2+Math.random()*7),vy:-(8+Math.random()*9),w:6+Math.random()*6,h:10+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],round:Math.random()<.25,life:260})}
  if(!run){run=true;requestAnimationFrame(frame)}}})();

/* ---- EDITOR DE LISTAS (ruleta/dado/shots) ---- */
function editList(key,title,defaults,fixed){
 const cur=key==='shots'?(store.get('shots',null)||SHOTS_ALC):S[key];
 modal(`<h3>${esc(title)}</h3><p class="muted small">Una opción por línea${fixed?` (exactamente ${fixed})`:' (2 a 16)'}.</p><textarea id="ed">${esc(cur.join('\n'))}</textarea>
 <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="$('#ed').value=${JSON.stringify(defaults).replace(/"/g,'&quot;')}.join('\\n')">Restaurar</button><button class="btn" onclick="saveList('${key}',${fixed||0})">Guardar</button></div>`)}
function saveList(key,fixed){
 let L=$('#ed').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,16);
 if(fixed&&L.length!==fixed)return toast(`Deben ser exactamente ${fixed} líneas`);
 if(L.length<2)return toast('Agrega al menos 2 opciones');
 if(key==='shots')store.set('shots',L);else{S[key]=L;save()}closeModal();toast('Guardado');render()}

/* ---- JUEGOS PERSONALIZADOS ---- */
SCREENS.custom={title:()=>'Juegos personalizados',render(){
 scr(`<div class="panel"><b>Mis juegos</b>${S.packs.length?S.packs.map((p,i)=>`<div class="pitem" style="margin-top:8px"><span style="font-size:1.6rem">${p.type==='ruleta'?'🎡':'🃏'}</span><span class="nm">${esc(p.name)}<br><small class="muted">${p.items.length} elementos · ${esc(p.cat||'General')}</small></span><button class="x" onclick="toggleFavPack(${i})">${p.fav?'★':'☆'}</button><button class="btn" style="padding:10px 12px" onclick="go('packPlay',${i})">▶</button></div>
  <div class="row" style="margin:6px 0 4px"><button class="btn ghost" style="padding:8px" onclick="sharePack(${i})">🔗 Compartir</button><button class="btn ghost" style="padding:8px" onclick="packForm(${i})">✏️ Editar</button><button class="btn ghost" style="padding:8px" onclick="delPack(${i})">🗑️</button></div>`).join(''):'<p class="muted">Todavía no creas juegos. ¡Arma el tuyo!</p>'}</div>
 <button class="btn mega" onclick="packForm()">＋ CREAR JUEGO</button>
 <div class="panel"><b>Importar juego compartido</b><textarea id="imp" style="min-height:70px;margin-top:8px" placeholder="Pega aquí el código PS1:…"></textarea><button class="btn cy full" style="margin-top:8px" onclick="importPack()">Importar</button></div>`)}};
function packForm(i){
 const p=i!=null?S.packs[i]:{name:'',type:'mazo',cat:'',players:4,secs:0,items:[]};
 modal(`<h3>${i!=null?'Editar':'Crear'} juego</h3>
 <label class="lb">Nombre</label><input type="text" id="pkN" maxlength="40" value="${esc(p.name)}" placeholder="Ej: Desafíos de la oficina">
 <label class="lb">Formato</label><select id="pkT"><option value="mazo" ${p.type==='mazo'?'selected':''}>🃏 Mazo de cartas (preguntas, desafíos, cartas)</option><option value="ruleta" ${p.type==='ruleta'?'selected':''}>🎡 Ruleta</option></select>
 <label class="lb">Categoría</label><input type="text" id="pkC" maxlength="30" value="${esc(p.cat)}" placeholder="Ej: Cumpleaños">
 <div class="row"><div><label class="lb">Jugadores</label><input type="number" id="pkP" min="2" max="20" value="${p.players}"></div><div><label class="lb">Tiempo por ronda</label><select id="pkS">${[0,15,30,60,90].map(s=>`<option value="${s}" ${p.secs==s?'selected':''}>${s?s+' s':'Sin tiempo'}</option>`).join('')}</select></div></div>
 <label class="lb">Preguntas / desafíos / opciones (una por línea)</label><textarea id="pkI" placeholder="Cuenta tu peor cita&#10;Imita al jefe&#10;…">${esc(p.items.join('\n'))}</textarea>
 <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePack(${i!=null?i:-1})">Guardar</button></div>`)}
function savePack(i){
 const items=$('#pkI').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,200);const name=$('#pkN').value.trim();
 if(!name)return toast('Ponle un nombre');if(items.length<2)return toast('Agrega al menos 2 elementos');
 const p={name,type:$('#pkT').value,cat:$('#pkC').value.trim(),players:Math.min(20,Math.max(2,+$('#pkP').value||4)),secs:+$('#pkS').value,items,fav:i>=0?S.packs[i].fav:false};
 if(p.type==='ruleta'&&items.length>16)return toast('La ruleta admite hasta 16 opciones');
 if(i>=0)S.packs[i]=p;else S.packs.push(p);save();closeModal();toast('Juego guardado');render()}
function delPack(i){modal(`<h3>¿Eliminar "${esc(S.packs[i].name)}"?</h3><div class="row"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn bad" onclick="S.packs.splice(${i},1);save();closeModal();render()">Eliminar</button></div>`)}
function toggleFavPack(i){S.packs[i].fav=!S.packs[i].fav;save();render()}
function packCode(p){const o={n:p.name,t:p.type,c:p.cat,p:p.players,s:p.secs,i:p.items};return 'PS1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function sharePack(i){const code=packCode(S.packs[i]);
 modal(`<h3>Compartir juego</h3><p class="muted small">Copia este código y envíalo. Tus amigos lo pegan en "Importar juego compartido".</p><textarea class="code" id="cd" readonly onclick="this.select()">${esc(code)}</textarea>
 <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cerrar</button><button class="btn" onclick="copyCode()">📋 Copiar código</button></div>`)}
function copyCode(){const v=$('#cd').value;const ok=()=>toast('Código copiado');try{navigator.clipboard.writeText(v).then(ok).catch(()=>{$('#cd').select();toast('Selecciona y copia el código')})}catch(e){$('#cd').select();toast('Selecciona y copia el código')}}
function importPack(){
 const v=($('#imp').value||'').trim();
 try{if(!v.startsWith('PS1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));
  if(!o.n||!Array.isArray(o.i)||o.i.length<2)throw 0;
  S.packs.push({name:String(o.n).slice(0,40),type:o.t==='ruleta'?'ruleta':'mazo',cat:String(o.c||'').slice(0,30),players:+o.p||4,secs:+o.s||0,items:o.i.map(x=>String(x).slice(0,200)).slice(0,o.t==='ruleta'?16:200),fav:false});
  save();toast('¡Juego importado!');render()}catch(e){toast('Código no válido')}}
const packOf=i=>typeof i==='string'&&i.startsWith('p:')?PREMIUM[i.slice(2)]:S.packs[i];
SCREENS.packPlay={title:i=>packOf(i)?packOf(i).name:'Juego',render(i){
 const P=packOf(i);if(!P){home();return}
 if(P.type==='ruleta'){
  scr(`<div id="whoBox"></div>${wheelBox()}<button class="btn mega" onclick="G.spin()">¡GIRAR!</button><div id="tm"></div><div id="res"></div>`);
  const w=makeWheel($('#wc'),P.items);
  window.G={spin(){if(w.spinning)return;const p=pickPlayer();$('#whoBox').innerHTML=whoHTML(p,'Gira por');$('#res').innerHTML='';$('#tm').innerHTML='';const idx=Math.floor(Math.random()*P.items.length);
   w.spin(idx,k=>{sfx.win();log(P.name,(p?p.name+': ':'')+P.items[k]);$('#res').innerHTML=`<div class="prompt">${esc(P.items[k])}</div>${scoreRow(p)}`;if(P.secs){timer($('#tm'),P.secs)}})}}}
 else{
  const st={deck:shuffle(P.items)};
  scr(`<div id="whoBox"></div><p class="center muted" id="left">${st.deck.length} cartas</p><div id="res"><div class="prompt" style="opacity:.6">Toca "Siguiente" para comenzar</div></div><div id="tm"></div><div id="sr"></div>
  <div class="row" style="margin-top:10px"><button class="btn mega" onclick="G.next()">SIGUIENTE ▶</button></div><button class="btn ghost full" style="margin-top:8px" onclick="render()">🔀 Reiniciar mazo</button>`);
  window.G={next(){clean();if(!st.deck.length){$('#res').innerHTML='<div class="prompt">🏁 ¡Mazo terminado!</div>';$('#sr').innerHTML='';$('#tm').innerHTML='';return}
   const x=st.deck.pop();const p=pickPlayer();$('#whoBox').innerHTML=whoHTML(p);$('#res').innerHTML=`<div class="prompt"><span class="kicker">${esc(P.cat||P.name)}</span>${esc(x)}</div>`;$('#left').textContent=st.deck.length+' cartas';$('#sr').innerHTML=scoreRow(p);$('#tm').innerHTML='';sfx.flip();log(P.name,(p?p.name+': ':'')+x);
   if(P.secs)timer($('#tm'),P.secs)}}}}};


SCREENS.premium={title:()=>'Paquetes especiales',render(){
 const U=unlocked();
 scr(`<p class="center muted">Gratis para siempre: mira un anuncio corto y el paquete queda desbloqueado en este teléfono.</p>
 <div class="grid">${Object.entries(PREMIUM).map(([k,p],i)=>{const ok=U.includes(k);return `<div class="tile premium ${ok?'':'locked'}" style="--i:${i}" onclick="${ok?`go('packPlay','p:${k}')`:`unlockPack('${k}')`}"><span class="lock">${ok?'✅':'🔒'}</span><span class="e">${p.e}</span><div><b>${esc(p.name)}</b><br><small>${p.items.length} cartas · ${ok?'Jugar ▶':'🎬 Ver anuncio'}</small></div></div>`}).join('')}</div>${bannerHTML()}`)}};
function unlockPack(k){rewarded('pack-'+k,()=>{const U=unlocked();if(!U.includes(k)){U.push(k);store.set('unlocked',U)}sfx.win();toast('🎁 ¡'+PREMIUM[k].name+' desbloqueado!');if(cur&&cur.name==='premium')render()})}

/* ---- MODO FIESTA ALEATORIO ---- */
const PCATS=[['verdad','🗣️ Verdades'],['desafio','🔥 Desafíos'],['yonunca','🙊 Yo nunca'],['probable','👉 El más probable'],['comp','⚔️ Competencias'],['azar','🎡 Azar y ruletas'],['cartas','🃏 Cartas']];
const PLEVELS=[['Fiesta tranquila','🙂',[1]],['Fiesta entretenida','😎',[1,2]],['Fiesta competitiva','🏆',[2]],['Fiesta extrema','🔥',[2,3]]];
SCREENS.party={title:()=>'Modo fiesta aleatorio',render(){
 const P=S.party;
 scr(`<div class="panel"><b>1. Jugadores</b><div class="strip" style="margin-top:8px" onclick="go('players')">${S.players.length?S.players.map(p=>av(p,32)).join('')+`<span class="muted small" style="margin-left:6px">${S.players.length} · editar</span>`:'👥 <b>Agregar jugadores</b>'}</div></div>
 <div class="panel"><b>2. Intensidad de la fiesta</b><div style="display:grid;gap:8px;margin-top:10px">${PLEVELS.map((l,i)=>`<button class="chip ${P.intensity===i?'on':''}" style="justify-content:flex-start;padding:12px 14px" onclick="S.party.intensity=${i};render()">${l[1]} ${l[0]}</button>`).join('')}</div>
 <p class="note">La intensidad cambia la dificultad y creatividad de los desafíos. Nunca la cantidad de alcohol.</p></div>
 <div class="panel"><b>3. Categorías</b><div class="chips" style="margin-top:10px">${PCATS.map(c=>`<button class="chip ${P.cats.includes(c[0])&&pcOpen(c[0])?'on':''}" style="${pcOpen(c[0])?'':'opacity:.5'}" onclick="partyCat('${c[0]}')">${pcOpen(c[0])?'':'🔒 '}${c[1]}</button>`).join('')}</div>
 <label class="lb">Duración de la sesión</label><div class="seg">${[0,30,60,90].map(m=>`<button class="${P.dur===m?'on':''}" onclick="S.party.dur=${m};render()">${m?m+' min':'Libre'}</button>`).join('')}</div>
 <label class="lb">Modo</label><div class="seg"><button class="${S.settings.competitive?'on':''}" onclick="S.settings.competitive=true;save();render()">🏆 Competitivo</button><button class="${!S.settings.competitive?'on':''}" onclick="S.settings.competitive=false;save();render()">😎 Informal</button></div>
 <label class="lb">Bebidas</label><div class="seg"><button class="${S.settings.alcohol?'on':''}" onclick="S.settings.alcohol=true;save();render()">🥃 Alcohol opcional</button><button class="${!S.settings.alcohol?'on':''}" onclick="S.settings.alcohol=false;save();render()">💧 Sin alcohol</button></div></div>
 <button class="btn mega" ${S.players.length<2?'disabled':''} onclick="partyStart()">4. ¡COMENZAR! 🎉</button>${S.players.length<2?'<p class="note">Agrega al menos 2 jugadores.</p>':''}`)}};
const PCAT_REQ={verdad:'desafios',desafio:'desafios',yonunca:'preguntas',probable:'preguntas',comp:'competencias',azar:'ruletas',cartas:'clasicos'};
const pcOpen=k=>catOpen(PCAT_REQ[k]);
function partyCat(k){if(!pcOpen(k))return lockedCat(PCAT_REQ[k]);const c=S.party.cats;const i=c.indexOf(k);if(i>=0){if(c.length>1)c.splice(i,1)}else c.push(k);render()}
function partyStart(){S.party.round=0;S.party.start=Date.now();S.party.warned=false;S.settings.intensity=[1,2,2,4][S.party.intensity];save();go('partyPlay')}
SCREENS.partyPlay={title:()=>'🎉 Modo fiesta',render(){
 const P=S.party;const lv=()=>rnd(PLEVELS[P.intensity][2]);
 const next=()=>{clean();P.round++;let t;
  if(P.round>1&&P.round%10===0)t='ranking';
  else if(P.round>1&&P.round%8===0)t='pausa';
  else if(P.dur&&!P.warned&&Date.now()-P.start>P.dur*60000){P.warned=true;t='tiempo'}
  else{let types=P.cats.filter(pcOpen);if(!types.length)types=['verdad','desafio','azar'];if(P.intensity===2&&types.includes('comp'))types.push('comp','comp');t=rnd(types)}
  const p=pickPlayer();let h='';const head=`<p class="center muted small" style="margin:0">Ronda ${P.round} · ${PLEVELS[P.intensity][0]}</p>`;
  if(t==='ranking'){const r=S.players.slice().sort((a,b)=>b.score-a.score);const top=r[0],low=r[r.length-1];h=`<div class="prompt"><span class="kicker">🏁 Cierre de ronda ${P.round/10}</span>${whoHTML(top,'🛡️ Mayor puntaje · se salva')}<div style="height:8px"></div>${whoHTML(low,'🥃 Menor puntaje · toma un shot')}</div><button class="btn or full" onclick="this.disabled=true;drinkShot(S.players.find(x=>x.id==='${low.id}'),'Menor puntaje de la ronda')">🥃 ¡Que tome ${esc(low.name)}!</button>`;log('Fiesta · Cierre',top.name+' se salva, '+low.name+' toma')}
  else if(t==='pausa')h=`<div class="prompt"><span class="kicker">💧 Pausa de hidratación</span>Todos toman un vaso de agua. ¡Recarga energía y sigue la fiesta!</div><p class="note">Recuerda: si tomaste, no manejes. Pidan un taxi o un conductor designado.</p>`;
  else if(t==='tiempo')h=`<div class="prompt"><span class="kicker">⏰ Tiempo cumplido</span>Se cumplieron los ${P.dur} minutos de la sesión. ¿Ven el podio o siguen jugando?</div><button class="btn or full" onclick="go('podium')">🏆 Ver podio</button>`;
  else if(t==='verdad'){const x=rnd(TRUTH[lv()]);h=`${whoHTML(p)}<div class="prompt"><span class="kicker">🗣️ Verdad</span>${esc(x)}</div>${scoreRow(p)}`;log('Fiesta · Verdad',p.name+': '+x)}
  else if(t==='desafio'){const x=rnd(DARE[lv()]);const s=rnd([20,30,45,60]);h=`${whoHTML(p)}<div class="prompt"><span class="kicker">🔥 Desafío · ${s} s</span>${esc(x)}</div><button class="btn cy full" id="tb" onclick="this.remove();timer($('#tm'),${s})">⏱️ Iniciar cuenta regresiva</button><div id="tm"></div>${scoreRow(p)}`;log('Fiesta · Desafío',p.name+': '+x)}
  else if(t==='yonunca'){const cats=Object.keys(NEVER).filter(c=>P.intensity>0||c!=='Adultos');const x=rnd(NEVER[rnd(cats)]);h=`<div class="prompt"><span class="kicker">🙊 Yo nunca nunca</span>${esc(x)}</div><p class="center">Quienes sí lo han hecho: ${sip()}.</p><p class="center muted small">${esc(p.name)} elige a uno de ellos para contar los detalles.</p>`;log('Fiesta · Yo nunca',x)}
  else if(t==='probable'){const x=rnd(LIKELY);h=`<div class="prompt"><span class="kicker">👉 El más probable</span>${esc(x)}</div><p class="center muted">A la cuenta de 3, todos apuntan. Toca al más votado:</p><div class="chips" style="justify-content:center">${S.players.map(q=>`<button class="chip" onclick="partyVote('${q.id}')">${q.avatar} ${esc(q.name)}</button>`).join('')}</div><div id="pv"></div>`;log('Fiesta · Más probable',x)}
  else if(t==='comp'){const x=rnd(QUICK);h=`<div class="prompt"><span class="kicker">⚔️ Ronda relámpago · 5 s por turno</span>${esc(x)}</div><p class="center">Empieza ${pname(p)} y sigue hacia la derecha, sin repetir. ¿Quién falló?</p><div class="chips" style="justify-content:center">${S.players.map(q=>`<button class="chip" onclick="partyLose('${q.id}',this)">${q.avatar} ${esc(q.name)}</button>`).join('')}</div><div id="tm"></div><button class="btn cy full" style="margin-top:8px" onclick="this.remove();timer($('#tm'),5)">⏱️ Cronómetro de 5 s</button>`;log('Fiesta · Competencia',x)}
  else if(t==='azar'){const L=S.settings.alcohol?SHOTS_ALC:SHOTS_NA;const opt=shotLabel(rnd(L.concat(S.wheel)));const a=actionFor(opt,p);h=`${whoHTML(p,'El azar elige a')}<div class="prompt"><span class="kicker">🎡 ${esc(opt)}</span>${a?esc(a.x):opt.toLowerCase().includes('shot simbólico')?'Sorbo simbólico de lo que quieras (agua vale) o cámbialo por un desafío.':'¡'+esc(opt)+'!'}</div>${a&&!['Jugador','Elige','Alternativa'].includes(a.k)?scoreRow(p):''}`;log('Fiesta · Azar',p.name+': '+opt)}
  else if(t==='cartas'){if(!S.deck.length)S.deck=buildDeck();const c=S.deck.pop();const T=CARD_TYPES[c.k];h=`${whoHTML(p)}<div class="prompt" style="border-color:${T.c}"><span class="kicker" style="color:${T.c}">${T.e} ${c.k}</span>${esc(c.t)}</div>${['Salvación','Cambio de turno'].includes(c.k)?'':scoreRow(c.k==='Todos participan'?null:p)}`;log('Fiesta · Carta',p.name+': '+c.k)}
  sfx.flip();
  scr(`${head}<div id="round">${h}</div><button class="btn mega" style="margin-top:14px" onclick="G.next()">SIGUIENTE RONDA ▶</button>
  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="G.next()">⏭ Saltar</button><button class="btn ghost" onclick="go('podium')">🏁 Terminar</button></div>
  <p class="note">❌ No cumplir = shot · Cada 10 rondas, el último toma y el líder se salva. 💧</p>`)};
 window.G={next};next()}};
function partyVote(id){const w=S.players.find(p=>p.id===id);const d=rnd(DARE[Math.min(3,Math.max(1,S.settings.intensity===4?3:S.settings.intensity))]);sfx.win();$('#pv').innerHTML=`<div class="prompt">${whoHTML(w,'👉 El más votado')}<span class="kicker" style="margin-top:10px">Desafío</span>${esc(d)}</div>${scoreRow(w)}`;document.querySelectorAll('#round .chips .chip').forEach(c=>c.disabled=true)}
function partyLose(id,btn){clean();const p=S.players.find(x=>x.id===id);addPts(p,-1,'fail','Perdió la ronda relámpago');sfx.buzz();document.querySelectorAll('#round .chips .chip').forEach(c=>c.disabled=true);btn.classList.add('on');}

/* ---- MARCADOR / PODIO ---- */
SCREENS.scores={title:()=>'Marcador',render(){
 const r=S.players.slice().sort((a,b)=>b.score-a.score);
 scr(`<div class="seg"><button class="${S.settings.competitive?'on':''}" onclick="S.settings.competitive=true;save();render()">🏆 Competitivo</button><button class="${!S.settings.competitive?'on':''}" onclick="S.settings.competitive=false;save();render()">😎 Informal</button></div>
 ${S.settings.competitive?`<div class="plist">${r.map((p,i)=>`<div class="pitem"><b style="width:22px">${i+1}</b>${av(p,36)}<span class="nm">${esc(p.name)}<br><small class="muted">✅ ${p.wins} · ❌ ${p.fails} · ⭐ ${p.creative} · 🥃 ${p.shots||0}</small></span><button class="x" onclick="adj('${p.id}',-1)">−</button><span class="sc">${p.score}</span><button class="x" onclick="adj('${p.id}',1)">＋</button></div>`).join('')||'<p class="muted center">Sin jugadores</p>'}</div>
 <div class="row" style="margin-top:14px"><button class="btn or" onclick="go('podium')">🏁 Ver podio final</button><button class="btn ghost" onclick="resetScores()">↺ Reiniciar puntos</button></div>
 <p class="note">Reglas: completar +1 · no completar −1 y toma un shot · ganar competencia +2. Al final, el de mayor puntaje se salva y el último toma.</p>`:`<div class="panel center"><p>En modo informal no se cuentan puntos. ¡Solo diversión! 🎉</p></div>`}`)}};
function adj(id,n){const p=S.players.find(x=>x.id===id);p.score+=n;save();render()}
function resetScores(){S.players.forEach(p=>{p.score=0;p.wins=0;p.fails=0;p.creative=0;p.shots=0});save();toast('Puntos reiniciados');render()}
SCREENS.podium={title:()=>'Podio final',render(){
 const r=S.players.slice().sort((a,b)=>b.score-a.score);
 if(r.length<2){scr(needPlayers());return}
 const by=k=>r.slice().sort((a,b)=>b[k]-a[k])[0];
 const best=(k,e,lbl)=>{const p=by(k);return p&&p[k]>0?`<div class="award"><span class="e">${e}</span><div><small class="muted">${lbl}</small><br>${av(p,24)} <b style="color:${p.color}">${esc(p.name)}</b> · ${p[k]}</div></div>`:''};
 sfx.win();
 scr(`<div class="podium">${[r[1],r[0],r[2]].map((p,i)=>p?`<div class="p${[2,1,3][i]}">${av(p,i===1?56:44)}<div style="font-weight:800;margin-top:6px">${esc(p.name)}</div><div class="sc" style="font:400 1.3rem Bungee;color:var(--ye)">${p.score}</div><div style="font-size:1.6rem">${['🥈','🥇','🥉'][i]}</div></div>`:'<div style="visibility:hidden"></div>').join('')}</div>
 <div class="award" style="border:1px solid var(--gr)"><span class="e">🛡️</span><div><small class="muted">Mayor puntaje · se salva de tomar</small><br>${av(r[0],24)} <b style="color:${r[0].color}">${esc(r[0].name)}</b> · ${r[0].score} pts</div></div>
 <div class="award" style="border:1px solid var(--rd)"><span class="e">🥃</span><div style="flex:1"><small class="muted">Último lugar · toma un shot</small><br>${av(r[r.length-1],24)} <b>${esc(r[r.length-1].name)}</b> · ${r[r.length-1].score} pts</div><button class="btn bad" style="padding:10px 12px" onclick="this.disabled=true;drinkShot(S.players.find(x=>x.id==='${r[r.length-1].id}'),'Último lugar de la partida')">¡A tomar!</button></div>
 ${best('wins','✅','Mayor cantidad de victorias')}${best('fails','🍀','Jugador más desafortunado')}${best('creative','⭐','Jugador más creativo')}${best('shots','🥃','Más shots de la noche')}
 <div class="panel center small">💧 Gracias por jugar responsablemente. <b>Si tomaste, no manejes.</b></div>
 <div class="row"><button class="btn mega" onclick="quickRestart()">↺ REINICIO RÁPIDO</button></div><button class="btn ghost full" style="margin-top:10px" onclick="home()">🏠 Volver al inicio</button>`)}};
function quickRestart(){S.players.forEach(p=>{p.score=0;p.wins=0;p.fails=0;p.creative=0;p.shots=0});S.deck=[];S.bag=[];save();toast('Nueva partida con los mismos jugadores');stack=[{name:'home'}];cur=null;go('party')}

/* ---- HISTORIAL ---- */
SCREENS.history={title:()=>'Historial de la sesión',render(){
 scr(S.history.length?S.history.map(h=>`<div class="hist"><small>${h.t} · ${esc(h.g)}</small><br>${esc(h.x)}</div>`).join(''):'<p class="muted center">Aún no se ha jugado nada en esta sesión.</p>')}};

/* ---- AJUSTES ---- */
SCREENS.settings={title:()=>'Ajustes',render(){
 const sw=(k,l,d)=>`<div class="toggle"><div><b>${l}</b><br><small class="muted">${d}</small></div><button class="sw ${S.settings[k]?'on':''}" onclick="setT('${k}')" aria-label="${l}"></button></div>`;
 scr(`<div class="panel">${sw('alcohol','Castigos con shot','Si se apaga, los castigos son sorbos de agua o bebida')}${sw('competitive','Modo competitivo con puntos','Apágalo para jugar informal')}${sw('sound','Efectos de sonido','Ruleta, dados, cartas y celebraciones')}${sw('music','Música de fondo','Ritmo discoteca sintetizado')}${sw('big','Modo pantalla grande','Textos más grandes para el centro de la mesa o un TV')}
 <label class="lb">Límite de shots por jugador (por partida)</label><div class="seg">${[3,5,8].map(n=>`<button class="${S.settings.shotLimit===n?'on':''}" onclick="S.settings.shotLimit=${n};save();render()">${n} shots</button>`).join('')}</div>
 <label class="lb">Intensidad por defecto</label><div class="seg">${[1,2,3,4].map(l=>`<button class="${S.settings.intensity===l?'on':''}" onclick="S.settings.intensity=${l};save();render()">${['','Tranquila','Entretenida','Picante','Extrema'][l]}</button>`).join('')}</div>
 <button class="btn ghost full" style="margin-top:14px" onclick="fullScreen()">⛶ Pantalla completa</button></div>
 <div class="panel rules"><b style="color:var(--ye)">Consumo responsable</b><ul><li>El que pierde toma un shot; el de mayor puntaje se salva.</li><li>Límite de shots por jugador en cada partida; luego, castigo con agua.</li><li>Quien no quiera alcohol juega con agua o bebida.</li><li>Agua y pausas: el modo fiesta propone una pausa cada 8 rondas.</li><li>Nadie conduce después de beber.</li></ul></div>
 <div class="panel"><b>Datos</b><p class="muted small">Jugadores, preferencias y juegos personalizados se guardan solo en este dispositivo.</p><p class="small"><a href="https://mauroalcainosa-rgb.github.io/partyshots/privacidad.html" target="_blank" rel="noopener" style="color:var(--cy)">📄 Política de privacidad</a>${AM?` · <a href="#" style="color:var(--cy)" onclick="event.preventDefault();AM.showPrivacyOptionsForm().catch(()=>toast('No disponible en tu región'))">Opciones de anuncios</a>`:''}</p><button class="btn ghost full" onclick="modal('<h3>¿Borrar todos los datos?</h3><p class=&quot;muted&quot;>Se eliminarán jugadores, puntos, favoritos y juegos personalizados.</p><div class=&quot;row&quot;><button class=&quot;btn ghost&quot; onclick=&quot;closeModal()&quot;>Cancelar</button><button class=&quot;btn bad&quot; onclick=&quot;wipe()&quot;>Borrar</button></div>')">🗑️ Borrar datos</button></div>
 <p class="note">PARTY SHOTS v1.0 · Solo mayores de 18 años</p>`)}};
function setT(k){S.settings[k]=!S.settings[k];save();if(k==='music'){S.settings.music?music.start():music.stop()}render()}
function fullScreen(){try{const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()).catch(()=>toast('Pantalla completa no disponible aquí'))}catch(e){toast('Pantalla completa no disponible aquí')}}
function wipe(){try{Object.keys(localStorage).filter(k=>k.startsWith('ps_')).forEach(k=>localStorage.removeItem(k))}catch(e){}PLAYS=0;ADCATS=[];S.players=[];S.favs=[];S.packs=[];S.wheel=DEFAULT_WHEEL.slice();S.dice=DEFAULT_DICE.slice();S.history=[];closeModal();toast('Datos borrados');cur=null;stack=[];go('gate')}

/* ===================== INICIO ===================== */
cur={name:store.get('adult',false)?'home':'gate'};render();
if(NATIVE){admobInit();const APP=(window.capacitorApp||{}).App;
 if(APP)APP.addListener('backButton',()=>{if($('#modal').classList.contains('on')){closeModal();return}
  if(!cur||cur.name==='home'||cur.name==='gate'){APP.minimizeApp?APP.minimizeApp():APP.exitApp();return}back()})}
</script>
</body>
</html>

<style type="text/tailwindcss">

/* ───────── WORLD COCKTAIL CLUB · tokens ─────────
   Negro profundo con matiz violeta, superficies grafito y cuatro neones:
   violeta (marca), fucsia (acción), turquesa (información/Local Twist), dorado (premium). */
@theme {
  --color-ink: #07050c;
  --color-graphite: #14111c;
  --color-smoke: #201b2a;
  --color-ash: #2d2738;
  --color-text: #f4effa;
  --color-muted: #a9a0b8;
  --color-faint: #6f6680;
  --color-violet: #8b3dff;
  --color-violet-soft: #b98cff;
  --color-fuchsia: #ff2ba6;
  --color-turq: #22e5d4;
  --color-gold: #d8b46a;
  --color-danger: #ff5c6c;

  --font-display: "Big Shoulders Display", Impact, sans-serif;
  --font-ui: "Big Shoulders Text", "Arial Narrow", sans-serif;
  --font-serif: "Newsreader", Georgia, serif;

  --radius-tile: 14px;
  --radius-pill: 999px;
}

:root {
  color-scheme: dark;
  --glow-violet: 0 0 6px rgb(139 61 255 / .9), 0 0 22px rgb(139 61 255 / .55), 0 0 60px rgb(139 61 255 / .25);
  --glow-fuchsia: 0 0 6px rgb(255 43 166 / .9), 0 0 20px rgb(255 43 166 / .5);
}

html { background: var(--color-ink); }
body {
  background: var(--color-ink);
  color: var(--color-text);
  font-family: var(--font-serif);
  font-size: 1.0625rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Textura sutil: grano de película sobre el fondo */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* Luz ambiental del club: dos focos que se desplazan muy lento */
.ambient {
  position: fixed;
  inset: -20vmax;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(40vmax 30vmax at 15% 10%, rgb(139 61 255 / .20), transparent 60%),
    radial-gradient(35vmax 28vmax at 90% 30%, rgb(255 43 166 / .12), transparent 60%),
    radial-gradient(30vmax 24vmax at 50% 100%, rgb(34 229 212 / .07), transparent 60%);
  animation: drift 38s ease-in-out infinite alternate;
}
@keyframes drift {
  to { transform: translate3d(-3vmax, 2vmax, 0) rotate(4deg); }
}

.font-display { font-family: var(--font-display); }
.font-ui { font-family: var(--font-ui); }
.font-serif { font-family: var(--font-serif); }

/* Letrero de neón: el texto se "enciende" una vez */
.neon-sign {
  font-family: var(--font-display);
  font-weight: 800;
  line-height: .86;
  letter-spacing: -.01em;
  color: #fff;
  text-shadow: 0 0 4px var(--neon, #8b3dff), 0 0 14px var(--neon, #8b3dff), 0 0 42px var(--neon, #8b3dff);
}
.neon-sign.ignite { animation: ignite 1.6s steps(1, end) both; }
@keyframes ignite {
  0% { opacity: .15; text-shadow: none; }
  12% { opacity: 1; }
  16% { opacity: .3; text-shadow: none; }
  24% { opacity: 1; }
  30% { opacity: .55; }
  42%, 100% { opacity: 1; }
}
.neon-line { filter: drop-shadow(0 0 3px var(--neon, #8b3dff)) drop-shadow(0 0 12px var(--neon, #8b3dff)); }
.ignite-svg { animation: ignite 1.6s steps(1, end) both; }

/* Superficie grafito con borde de luz interior */
.surface {
  background: linear-gradient(180deg, rgb(255 255 255 / .035), rgb(255 255 255 / .01)), var(--color-graphite);
  border: 1px solid rgb(255 255 255 / .07);
  border-radius: var(--radius-tile);
}

/* Botón principal: tubo fucsia */
.btn-neon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  font-family: var(--font-ui);
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #fff;
  background: linear-gradient(180deg, #ff4fb7, #e01686);
  border-radius: var(--radius-pill);
  padding: .9rem 1.6rem;
  box-shadow: 0 0 0 1px rgb(255 255 255 / .18) inset, 0 8px 30px -8px rgb(255 43 166 / .8);
  transition: box-shadow .2s ease, transform .2s ease;
}
.btn-neon:hover { box-shadow: 0 0 0 1px rgb(255 255 255 / .3) inset, 0 0 26px rgb(255 43 166 / .7), 0 10px 40px -6px rgb(255 43 166 / .9); }
.btn-neon:active { transform: translateY(1px) scale(.99); }
.btn-neon:disabled { opacity: .5; cursor: not-allowed; }

.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  font-family: var(--font-ui); font-weight: 600; letter-spacing: .04em;
  color: var(--color-text);
  border: 1px solid rgb(255 255 255 / .16);
  border-radius: var(--radius-pill);
  padding: .7rem 1.2rem;
  transition: border-color .2s, background .2s;
}
.btn-ghost:hover { border-color: var(--color-violet-soft); background: rgb(139 61 255 / .1); }

.chip {
  font-family: var(--font-ui);
  font-size: .82rem;
  letter-spacing: .03em;
  border: 1px solid rgb(255 255 255 / .12);
  border-radius: var(--radius-pill);
  padding: .25rem .7rem;
  color: var(--color-muted);
  white-space: nowrap;
}
.chip[aria-pressed="true"], .chip.on {
  color: #fff; border-color: var(--color-violet); background: rgb(139 61 255 / .22);
  box-shadow: 0 0 12px rgb(139 61 255 / .35);
}

.field {
  width: 100%;
  background: var(--color-smoke);
  border: 1px solid rgb(255 255 255 / .1);
  border-radius: 10px;
  padding: .75rem .9rem;
  font-family: var(--font-ui);
  font-size: 1rem;
  color: var(--color-text);
}
.field:focus { outline: none; border-color: var(--color-violet); box-shadow: 0 0 0 3px rgb(139 61 255 / .3); }

.prose-club p { margin: 0 0 1rem; max-width: 68ch; }
.prose-club { font-size: 1.12rem; line-height: 1.72; }

/* Aparición progresiva de tarjetas (solo una vez, al montar la grilla) */
.reveal > * { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
.reveal > *:nth-child(2) { animation-delay: .04s; }
.reveal > *:nth-child(3) { animation-delay: .08s; }
.reveal > *:nth-child(4) { animation-delay: .12s; }
.reveal > *:nth-child(5) { animation-delay: .16s; }
.reveal > *:nth-child(6) { animation-delay: .2s; }
.reveal > *:nth-child(n+7) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.scroll-x { overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
.scroll-x > * { scroll-snap-align: start; }

:focus-visible { outline: 2px solid var(--color-turq); outline-offset: 3px; border-radius: 6px; }

/* Accesibilidad: preferencia del sistema o interruptor del usuario */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
html[data-motion="reduced"] *, html[data-motion="reduced"] *::before, html[data-motion="reduced"] *::after {
  animation: none !important; transition: none !important;
}

</style>
<style>body{padding-top:env(safe-area-inset-top)}@keyframes bulb{50%{opacity:.25}}.wheel-bulb{animation:bulb .9s steps(1) infinite}@media (prefers-reduced-motion:reduce){.wheel-bulb{animation:none}}html[data-motion=reduced] .wheel-bulb{animation:none}</style>
</head>
